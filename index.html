x solid #ffffff77;background:#253b52db;color:white;border-radius:50%;width:58px;height:58px;font-size:27px;font-weight:800;touch-action:none;user-select:none}button:active{background:#4b7796}button svg{width:29px;height:29px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}#fire{right:22px;bottom:108px;width:76px;height:76px;background:#b94b49dc}#fire svg{width:36px;height:36px}#jump{right:115px;bottom:22px}#crouch{right:22px;bottom:20px}#reload{right:118px;bottom:118px;width:48px;height:48px;font-size:24px}#weaponToggle{right:190px;bottom:28px;width:54px;height:54px;background:#233747eb;font-size:25px}#weaponWheel{position:absolute;right:154px;bottom:78px;width:164px;height:164px;border-radius:50%;background:#15242fe8;border:2px solid #ffffff77;display:none;pointer-events:auto;box-shadow:0 4px 24px #0009}#weaponWheel.open{display:block}#weaponWheel button{width:62px;height:62px;font-size:29px}#choosePistol{left:51px;top:12px}#chooseKnife{left:51px;bottom:12px}#weaponLabel{position:absolute;right:190px;bottom:88px;font-size:12px;text-shadow:0 2px 4px #000}#hint{display:none}@media(max-height:420px){#radar{width:80px;height:80px}#joy{width:106px;height:106px;bottom:15px}#knob{left:31px;top:31px}#fire{bottom:84px}#reload{bottom:93px}#jump,#crouch{bottom:10px}#stats{bottom:6px}}
