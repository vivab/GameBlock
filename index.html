<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Block Strike Style</title>
<style>
*{touch-action:none;user-select:none;-webkit-user-select:none;box-sizing:border-box;margin:0;padding:0}
body{overflow:hidden;background:#000;font-family:Segoe UI,Arial,sans-serif}
#crosshair{position:absolute;top:50%;left:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border:1.5px solid rgba(255,255,255,.9);border-radius:50%;pointer-events:none;z-index:15;box-shadow:0 0 3px #000}
#crosshair::after{content:'';position:absolute;top:2.5px;left:2.5px;width:2px;height:2px;background:#ff3b3b;border-radius:50%}
#touch-move-area{position:absolute;left:0;top:0;width:50%;height:100%;z-index:5}
#touch-look-area{position:absolute;right:0;top:0;width:50%;height:100%;z-index:5}
#joystick-base{position:absolute;width:110px;height:110px;border:2px solid rgba(255,255,255,.35);border-radius:50%;background:rgba(0,0,0,.3);display:none;pointer-events:none;z-index:6;transform:translate(-50%,-50%)}
#joystick-knob{position:absolute;top:50%;left:50%;width:44px;height:44px;background:rgba(255,255,255,.8);border-radius:50%;transform:translate(-50%,-50%)}
.btn{position:absolute;z-index:20;background:rgba(15,15,20,.55);border:1.5px solid rgba(255,255,255,.45);border-radius:50%;color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.btn:active{background:rgba(255,255,255,.25)}
#btn-fire{right:22px;bottom:32px;width:82px;height:82px;background:rgba(180,40,40,.65);border-color:rgba(255,100,100,.5);font-size:14px}
#btn-jump{right:118px;bottom:28px;width:58px;height:58px}
#btn-crouch{right:118px;bottom:96px;width:58px;height:58px}
#btn-crouch.active{background:rgba(40,160,60,.55);border-color:rgba(80,220,100,.7)}
#btn-reload{right:22px;bottom:130px;width:58px;height:58px;background:rgba(180,140,30,.55)}
#hud{position:absolute;top:14px;left:14px;z-index:20;color:#fff;font-weight:700;text-shadow:0 1px 4px #000;font-size:15px;pointer-events:none;background:rgba(0,0,0,.35);padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.1)}
#minimap-container{position:absolute;top:14px;right:14px;z-index:20;width:108px;height:108px;border-radius:50%;border:2px solid rgba(255,255,255,.7);overflow:hidden;background:rgba(0,0,0,.6)}
#minimap{width:100%;height:100%}
#kill-feed{position:absolute;top:135px;right:14px;z-index:20;display:flex;flex-direction:column;align-items:flex-end;gap:5px;pointer-events:none}
.kill-entry{background:rgba(0,0,0,.72);padding:5px 11px;border-radius:5px;font-size:12.5px;font-weight:600;color:#ccc;border:1px solid rgba(255,255,255,.12);text-shadow:0 1px 2px #000}
.name-white{color:#fff}.name-other{color:#ff8a8a}
#tune-btn{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:30;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.55);color:#fff;font-size:18px}
#tune-panel{position:absolute;top:64px;left:50%;transform:translateX(-50%);z-index:30;width:min(340px,92vw);background:rgba(10,12,20,.92);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:10px;color:#fff;font-size:12px;display:none}
#tune-panel label{display:flex;align-items:center;gap:8px;margin:4px 0}
#tune-panel input{flex:1}
#tune-panel button{margin-top:8px;padding:6px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:#334155;color:#fff}
</style>
</head>
<body>
<div id="crosshair"></div>
<div id="touch-move-area"></div>
<div id="touch-look-area"></div>
<div id="joystick-base"><div id="joystick-knob"></div></div>
<div id="btn-fire" class="btn">ОГОНЬ</div>
<div id="btn-jump" class="btn">ПРЫЖОК</div>
<div id="btn-crouch" class="btn">ПРИСЕСТЬ</div>
<div id="btn-reload" class="btn">R</div>
<div id="hud">ПАТРОНЫ: <span id="ammo">7 / 21</span></div>
<div id="minimap-container"><canvas id="minimap" width="108" height="108"></canvas></div>
<div id="kill-feed"></div>
<button id="tune-btn">⚙</button>
<div id="tune-panel">
  <div style="margin-bottom:6px;font-weight:700">Настройка рук / пистолета</div>
  <label>X <input type="range" id="tx" min="-0.4" max="0.4" step="0.005" value="0.05"></label>
  <label>Y <input type="range" id="ty" min="-0.4" max="0.2" step="0.005" value="-0.03"></label>
  <label>Z <input type="range" id="tz" min="-0.3" max="0.3" step="0.005" value="0.02"></label>
  <label>RotX <input type="range" id="rx" min="-0.5" max="0.5" step="0.01" value="0"></label>
  <label>RotY <input type="range" id="ry" min="-0.5" max="0.5" step="0.01" value="0"></label>
  <button id="copy-tune">Скопировать значения</button>
</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x6bb3d9);
scene.fog = new THREE.Fog(0x6bb3d9, 25, 70);

const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.05, 200);
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const sun = new THREE.DirectionalLight(0xfff5e0, 1.15);
sun.position.set(18, 35, 12);
sun.castShadow = true;
scene.add(sun);
scene.add(new THREE.AmbientLight(0x8899aa, 0.55));
scene.add(new THREE.HemisphereLight(0xb8d4ff, 0x445533, 0.4));

const yawObject = new THREE.Object3D();
const pitchObject = new THREE.Object3D();
pitchObject.add(camera);
yawObject.add(pitchObject);
yawObject.position.set(0, 1.6, 9);
scene.add(yawObject);

// ===== VIEWMODEL =====
const weaponGroup = new THREE.Group();
camera.add(weaponGroup);

const skinMat = new THREE.MeshStandardMaterial({color:0xf0c090, roughness:0.75});
const metalDark = new THREE.MeshStandardMaterial({color:0x222, roughness:0.35, metalness:0.7});
const metalSlide = new THREE.MeshStandardMaterial({color:0x3a3a3a, roughness:0.3, metalness:0.75});
const gripMat = new THREE.MeshStandardMaterial({color:0x1a1a1a, roughness:0.7});

// Более реалистичные руки (Standoff-like)
const rightForearm = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.09, 0.28), skinMat);
rightForearm.position.set(0.20, -0.20, -0.22);
rightForearm.rotation.set(-0.25, -0.1, 0.15);
weaponGroup.add(rightForearm);

const rightHand = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.07, 0.1), skinMat);
rightHand.position.set(0.19, -0.24, -0.38);
rightHand.rotation.set(-0.1, 0, 0.2);
weaponGroup.add(rightHand);

const leftForearm = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.24), skinMat);
leftForearm.position.set(0.06, -0.23, -0.30);
leftForearm.rotation.set(-0.15, 0.35, -0.1);
weaponGroup.add(leftForearm);

const leftHand = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.06, 0.09), skinMat);
leftHand.position.set(0.04, -0.26, -0.44);
leftHand.rotation.set(0.1, 0.2, 0);
weaponGroup.add(leftHand);

// Deagle
const grip = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.16, 0.08), gripMat);
grip.position.set(0.18, -0.14, -0.40);
grip.rotation.x = 0.3;
weaponGroup.add(grip);

const frame = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.07, 0.22), metalDark);
frame.position.set(0.18, -0.07, -0.48);
weaponGroup.add(frame);

const slide = new THREE.Mesh(new THREE.BoxGeometry(0.065, 0.085, 0.32), metalSlide);
slide.position.set(0.18, 0.005, -0.50);
weaponGroup.add(slide);

const barrel = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.03, 0.11), metalDark);
barrel.position.set(0.18, -0.025, -0.70);
weaponGroup.add(barrel);

const frontSight = new THREE.Mesh(new THREE.BoxGeometry(0.018, 0.03, 0.02), metalDark);
frontSight.position.set(0.18, 0.05, -0.64);
weaponGroup.add(frontSight);

weaponGroup.position.set(0.05, -0.03, 0.02);

// ===== КАРТА + КОЛЛИЗИИ =====
const floor = new THREE.Mesh(new THREE.PlaneGeometry(90,90), new THREE.MeshStandardMaterial({color:0x3d6b2e, roughness:0.9}));
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
scene.add(floor);

const wallMat = new THREE.MeshStandardMaterial({color:0x8a5a30, roughness:0.85});
const walls = [];
function addWall(w,h,d,x,y,z){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), wallMat);
  m.position.set(x,y,z);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  walls.push({mesh:m, box:new THREE.Box3().setFromObject(m)});
}
addWall(9,3.8,1.1, -3,1.9,-1);
addWall(1.1,3.8,9, 5,1.9,-3);
addWall(6,2.2,1.1, 0,1.1,-10);
addWall(1.1,2.2,5, -8,1.1,2);

const crateMat = new THREE.MeshStandardMaterial({color:0x6b4423, roughness:0.8});
[[-6,1.2,-8],[3,1.2,-12],[-1,1.2,4],[8,1.2,-6]].forEach(p=>{
  const c = new THREE.Mesh(new THREE.BoxGeometry(2.4,2.4,2.4), crateMat);
  c.position.set(...p); c.castShadow=true; c.receiveShadow=true;
  scene.add(c);
  walls.push({mesh:c, box:new THREE.Box3().setFromObject(c)});
});

// ===== БОТЫ =====
function createCharacter(team, name, x, z){
  const g = new THREE.Group();
  g.position.set(x,0,z);
  const coat = team==='T' ? 0xc62828 : 0x1565c0;
  const matJ = new THREE.MeshStandardMaterial({color:coat, roughness:0.55});
  const matP = new THREE.MeshStandardMaterial({color:0x1a1a1a});
  const matH = new THREE.MeshStandardMaterial({color:0xf0c090, roughness:0.7});
  const matD = new THREE.MeshBasicMaterial({color:0x111});

  const head = new THREE.Mesh(new THREE.BoxGeometry(0.36,0.36,0.36), matH);
  head.position.set(0,1.58,0); head.userData={bodyPart:'head',enemy:g}; g.add(head);
  [[-0.08,1.62,-0.18],[0.08,1.62,-0.18]].forEach(([x,y,z])=>{
    const e=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.06,0.02),matD); e.position.set(x,y,z); g.add(e);
  });
  const mouth=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.035,0.02),matD); mouth.position.set(0,1.48,-0.18); g.add(mouth);

  const body=new THREE.Mesh(new THREE.BoxGeometry(0.48,0.62,0.27),matJ);
  body.position.set(0,1.08,0); body.userData={bodyPart:'body',enemy:g}; g.add(body);

  [-0.34,0.34].forEach(ax=>{
    const arm=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.55,0.16),matJ);
    arm.position.set(ax,1.06,0); arm.userData={bodyPart:'arm',enemy:g}; g.add(arm);
  });
  [-0.13,0.13].forEach(lx=>{
    const leg=new THREE.Mesh(new THREE.BoxGeometry(0.18,0.58,0.18),matP);
    leg.position.set(lx,0.42,0); leg.userData={bodyPart:'leg',enemy:g}; g.add(leg);
  });

  g.userData={hp:100,name,team,spawnPos:new THREE.Vector3(x,0,z),isDead:false};
  scene.add(g);
  return g;
}
const enemies=[
  createCharacter('T','Terrorist #1',-4,-7),
  createCharacter('T','Terrorist #2',3,-11),
  createCharacter('CT','CT #1',7,-5)
];

// ===== УПРАВЛЕНИЕ =====
let moveTouchId=null, lookTouchId=null, fireTouchId=null;
let touchStart={x:0,y:0}, joy={x:0,y:0}, lookLast={x:0,y:0};
const moveArea=document.getElementById('touch-move-area');
const lookArea=document.getElementById('touch-look-area');
const jsBase=document.getElementById('joystick-base');
const jsKnob=document.getElementById('joystick-knob');
const btnFire=document.getElementById('btn-fire');

moveArea.addEventListener('touchstart',e=>{
  for(const t of e.changedTouches)if(moveTouchId===null){
    moveTouchId=t.identifier; touchStart={x:t.clientX,y:t.clientY};
    jsBase.style.left=t.clientX+'px'; jsBase.style.top=t.clientY+'px'; jsBase.style.display='block';
    joy={x:0,y:0};
  }
});
moveArea.addEventListener('touchmove',e=>{
  for(const t of e.changedTouches)if(t.identifier===moveTouchId){
    const dx=t.clientX-touchStart.x, dy=t.clientY-touchStart.y;
    const dist=Math.hypot(dx,dy), maxR=42, ang=Math.atan2(dy,dx), cl=Math.min(dist,maxR);
    const kx=Math.cos(ang)*cl, ky=Math.sin(ang)*cl;
    jsKnob.style.transform=`translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`;
    joy.x=kx/maxR; joy.y=ky/maxR;
  }
});
const resetJoy=e=>{for(const t of e.changedTouches)if(t.identifier===moveTouchId){moveTouchId=null;jsBase.style.display='none';joy={x:0,y:0}}};
moveArea.addEventListener('touchend',resetJoy); moveArea.addEventListener('touchcancel',resetJoy);

function handleLook(dx,dy){
  yawObject.rotation.y-=dx*0.0038;
  pitchObject.rotation.x-=dy*0.0038;
  pitchObject.rotation.x=Math.max(-1.3,Math.min(1.3,pitchObject.rotation.x));
}
lookArea.addEventListener('touchstart',e=>{for(const t of e.changedTouches)if(lookTouchId===null){lookTouchId=t.identifier;lookLast={x:t.clientX,y:t.clientY}}});
lookArea.addEventListener('touchmove',e=>{for(const t of e.changedTouches)if(t.identifier===lookTouchId){handleLook(t.clientX-lookLast.x,t.clientY-lookLast.y);lookLast={x:t.clientX,y:t.clientY}}});
const resetLook=e=>{for(const t of e.changedTouches)if(t.identifier===lookTouchId)lookTouchId=null};
lookArea.addEventListener('touchend',resetLook); lookArea.addEventListener('touchcancel',resetLook);

// Стрельба + разброс + отдача
let isHoldingFire=false, lastFire=0, fireRate=230;
let ammo=7, reserve=21, reloading=false;
let spreadAcc=0;
const raycaster=new THREE.Raycaster();
let isCrouching=false, isGrounded=true, velocityY=0;
const targetH={current:1.6};
const playerR=0.38;
let bulletDecals=[];

function getSpread(){
  const moving=Math.abs(joy.x)>0.25||Math.abs(joy.y)>0.25;
  if(!isGrounded && moving) return 0.085;      // бег + прыжок
  if(!isGrounded) return 0.055;                // прыжок
  if(moving) return 0.032;                     // бег
  if(isCrouching) return 0.008;                // сидя
  return 0.018;                                // стоя
}

function updateAmmo(){document.getElementById('ammo').textContent=`${ammo} / ${reserve}`;}

document.getElementById('btn-reload').addEventListener('touchstart',e=>{
  e.preventDefault();
  if(reloading||ammo===7||reserve<=0)return;
  reloading=true; document.getElementById('ammo').textContent='ПЕРЕЗАРЯДКА...';
  setTimeout(()=>{const n=7-ammo,t=Math.min(n,reserve);ammo+=t;reserve-=t;reloading=false;updateAmmo()},1500);
});

function addKill(killer,victim){
  const f=document.getElementById('kill-feed');
  const d=document.createElement('div'); d.className='kill-entry';
  d.innerHTML=`<span class="${killer==='Игрок'?'name-white':'name-other'}">${killer}</span> <span style="color:#ff4444">☠</span> <span class="${victim==='Игрок'?'name-white':'name-other'}">${victim}</span>`;
  f.appendChild(d); if(f.children.length>5)f.removeChild(f.children[0]);
  setTimeout(()=>d.remove(),4000);
}

function createDecal(pos, normal){
  const m=new THREE.Mesh(
    new THREE.CircleGeometry(0.07,8),
    new THREE.MeshBasicMaterial({color:0x111,transparent:true,opacity:0.85,side:THREE.DoubleSide,depthWrite:false})
  );
  m.position.copy(pos).addScaledVector(normal,0.015);
  m.lookAt(pos.clone().add(normal));
  scene.add(m);
  bulletDecals.push({mesh:m, life:3.0});
}

function shoot(){
  if(reloading||ammo<=0)return;
  ammo--; updateAmmo();

  // Отдача Block Strike style
  pitchObject.rotation.x += 0.045 + Math.random()*0.015;
  yawObject.rotation.y += (Math.random()-0.5)*0.018;
  weaponGroup.position.z = 0.13;
  weaponGroup.rotation.x = 0.08;

  const baseSpread = getSpread();
  spreadAcc = Math.min(spreadAcc + baseSpread*0.6, baseSpread*1.8);
  const sx = (Math.random()-0.5)*spreadAcc;
  const sy = (Math.random()-0.5)*spreadAcc;

  raycaster.setFromCamera(new THREE.Vector2(sx,sy), camera);

  const targets=[];
  enemies.forEach(e=>{if(!e.userData.isDead)e.traverse(c=>{if(c.isMesh)targets.push(c)})});
  walls.forEach(w=>targets.push(w.mesh));

  const hits=raycaster.intersectObjects(targets,false);
  if(hits.length){
    const hit=hits[0];
    let enemy=null, part='body';
    if(hit.object.userData && hit.object.userData.enemy){
      enemy=hit.object.userData.enemy;
      part=hit.object.userData.bodyPart||'body';
    }
    if(enemy && !enemy.userData.isDead){
      let dmg=25;
      if(part==='head') dmg=99+Math.floor(Math.random()*2);          // 99-100
      else if(part==='body') dmg=20+Math.floor(Math.random()*21);    // 20-40
      else dmg=10+Math.floor(Math.random()*16);                      // 10-25 руки/ноги

      enemy.userData.hp-=dmg;
      if(enemy.userData.hp<=0){
        enemy.userData.isDead=true;
        enemy.rotation.x=-Math.PI/2; enemy.position.y=0.15;
        addKill('Игрок',enemy.userData.name);
        setTimeout(()=>{
          enemy.userData.isDead=false; enemy.userData.hp=100;
          enemy.rotation.x=0; enemy.position.copy(enemy.userData.spawnPos);
        },3200);
      }
    } else if(hit.face){
      createDecal(hit.point, hit.face.normal);
    }
  }
}

btnFire.addEventListener('touchstart',e=>{
  e.preventDefault(); isHoldingFire=true;
  for(const t of e.changedTouches){fireTouchId=t.identifier; lookLast={x:t.clientX,y:t.clientY}}
});
btnFire.addEventListener('touchmove',e=>{
  for(const t of e.changedTouches)if(t.identifier===fireTouchId){
    handleLook(t.clientX-lookLast.x,t.clientY-lookLast.y); lookLast={x:t.clientX,y:t.clientY};
  }
});
const stopFire=e=>{for(const t of e.changedTouches)if(t.identifier===fireTouchId){isHoldingFire=false;fireTouchId=null}};
btnFire.addEventListener('touchend',stopFire); btnFire.addEventListener('touchcancel',stopFire);

document.getElementById('btn-crouch').addEventListener('touchstart',e=>{
  e.preventDefault(); isCrouching=!isCrouching;
  document.getElementById('btn-crouch').classList.toggle('active',isCrouching);
});
document.getElementById('btn-jump').addEventListener('touchstart',e=>{
  e.preventDefault(); if(isGrounded){velocityY=5.5; isGrounded=false}
});

// Кастомизация
const tuneBtn=document.getElementById('tune-btn');
const tunePanel=document.getElementById('tune-panel');
tuneBtn.onclick=()=>tunePanel.style.display=tunePanel.style.display==='block'?'none':'block';
['tx','ty','tz','rx','ry'].forEach(id=>{
  document.getElementById(id).oninput=()=>{
    weaponGroup.position.x=+document.getElementById('tx').value;
    weaponGroup.position.y=+document.getElementById('ty').value;
    weaponGroup.position.z=+document.getElementById('tz').value;
    weaponGroup.rotation.x=+document.getElementById('rx').value;
    weaponGroup.rotation.y=+document.getElementById('ry').value;
  };
});
document.getElementById('copy-tune').onclick=()=>{
  const v=`position: (${document.getElementById('tx').value}, ${document.getElementById('ty').value}, ${document.getElementById('tz').value})\nrotation: (${document.getElementById('rx').value}, ${document.getElementById('ry').value}, 0)`;
  prompt('Скопируй и скинь мне:', v);
};

// Радар
const ctx=document.getElementById('minimap').getContext('2d');
function updateMinimap(){
  ctx.clearRect(0,0,108,108);
  const cx=54,cy=54,scale=3.3,rot=yawObject.rotation.y;
  ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx-16,cy-26); ctx.moveTo(cx,cy); ctx.lineTo(cx+16,cy-26); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(cx,cy,3.5,0,Math.PI*2); ctx.fill();
  enemies.forEach(e=>{
    if(e.userData.isDead)return;
    const rx=e.position.x-yawObject.position.x, rz=e.position.z-yawObject.position.z;
    const mx=cx+(rx*Math.cos(-rot)-rz*Math.sin(-rot))*scale;
    const my=cy+(rx*Math.sin(-rot)+rz*Math.cos(-rot))*scale;
    ctx.fillStyle='#ff2a2a'; ctx.beginPath(); ctx.arc(mx,my,3.5,0,Math.PI*2); ctx.fill();
  });
}

function canMoveTo(pos){
  for(const w of walls){
    const b=w.box;
    if(pos.x>b.min.x-playerR && pos.x<b.max.x+playerR && pos.z>b.min.z-playerR && pos.z<b.max.z+playerR) return false;
  }
  for(const e of enemies){
    if(e.userData.isDead)continue;
    if(Math.hypot(pos.x-e.position.x,pos.z-e.position.z)<playerR+0.4) return false;
  }
  return true;
}

let lastTime=performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now();
  const dt=Math.min((now-lastTime)/1000,0.09);
  lastTime=now;

  if(isHoldingFire && now-lastFire>fireRate){shoot(); lastFire=now}

  // плавное возвращение отдачи
  weaponGroup.position.z += (0 - weaponGroup.position.z)*0.15;
  weaponGroup.rotation.x += (0 - weaponGroup.rotation.x)*0.12;
  spreadAcc = Math.max(0, spreadAcc - dt*0.14);

  // следы пуль 3 сек
  for(let i=bulletDecals.length-1;i>=0;i--){
    bulletDecals[i].life-=dt;
    if(bulletDecals[i].life<=0){
      scene.remove(bulletDecals[i].mesh);
      bulletDecals.splice(i,1);
    } else {
      bulletDecals[i].mesh.material.opacity = Math.min(0.85, bulletDecals[i].life*0.4);
    }
  }

  const desiredY=isCrouching?0.92:1.6;
  targetH.current += (desiredY-targetH.current)*11*dt;

  const speed=isCrouching?3.3:6.8;
  const forward=new THREE.Vector3(0,0,-1).applyQuaternion(yawObject.quaternion);
  const side=new THREE.Vector3(1,0,0).applyQuaternion(yawObject.quaternion);
  forward.y=0; forward.normalize(); side.y=0; side.normalize();

  const mx=(forward.x*-joy.y + side.x*joy.x)*speed*dt;
  const mz=(forward.z*-joy.y + side.z*joy.x)*speed*dt;

  const nX=yawObject.position.clone(); nX.x+=mx;
  if(canMoveTo(nX)) yawObject.position.x=nX.x;
  const nZ=yawObject.position.clone(); nZ.z+=mz;
  if(canMoveTo(nZ)) yawObject.position.z=nZ.z;

  velocityY-=19.5*dt;
  yawObject.position.y+=velocityY*dt;
  if(yawObject.position.y<=targetH.current){
    yawObject.position.y=targetH.current; velocityY=0; isGrounded=true;
  }

  updateMinimap();
  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
