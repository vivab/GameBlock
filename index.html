<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#202f22"><title>GameBlock</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;background:#87c5f4;font-family:system-ui,sans-serif;user-select:none}#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}#hud{position:fixed;inset:0;pointer-events:none}#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:35px;font-weight:300;color:white;text-shadow:0 0 4px #222}#ammo{position:absolute;right:18px;top:15px;color:white;font-weight:800;font-size:22px;text-shadow:0 2px 4px #222}#message{position:absolute;top:17px;left:15px;color:white;font-size:14px;font-weight:700;text-shadow:0 2px 4px #222}#fire{position:absolute;right:24px;bottom:38px;width:88px;height:88px;border:2px solid #ffffffa8;border-radius:50%;background:#df5446b8;color:white;font-size:37px;pointer-events:auto;touch-action:none}#fire:active{background:#ff7666}#tip{position:absolute;left:14px;bottom:17px;color:#fff;font-size:12px;text-shadow:0 1px 4px #222;opacity:.8}#error{position:absolute;left:10px;right:10px;top:35%;background:#3a1b1bee;color:white;padding:15px;border-radius:10px;display:none;white-space:pre-wrap;font-size:13px}</style></head>
<body><canvas id="game"></canvas><div id="hud"><div id="cross">+</div><div id="ammo">12 / ∞</div><div id="message">GameBlock • тест 1</div><button id="fire" aria-label="Стрелять">◎</button><div id="tip">Води пальцем по экрану — прицеливайся</div><div id="error"></div></div><script type="module" src="./src/main.js"></script></body></html>
