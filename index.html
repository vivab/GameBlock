<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Block Strike Mobile FPS</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Segoe UI,sans-serif;
}

canvas{
    display:block;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:9px;
    height:9px;
    margin:-4.5px 0 0 -4.5px;
    border:1.5px solid rgba(255,255,255,.9);
    border-radius:50%;
    z-index:50;
    pointer-events:none;
    box-shadow:0 0 4px #000;
}

#crosshair:after{
    content:"";
    position:absolute;
    width:2px;
    height:2px;
    left:2px;
    top:2px;
    border-radius:50%;
    background:#ff4444;
}

#touch-move-area{
    position:absolute;
    left:0;
    top:0;
    width:50%;
    height:100%;
    z-index:5;
}

#touch-look-area{
    position:absolute;
    right:0;
    top:0;
    width:50%;
    height:100%;
    z-index:5;
}

#joystick-base{
    position:absolute;
    width:112px;
    height:112px;
    border-radius:50%;
    transform:translate(-50%,-50%);
    border:2px solid rgba(255,255,255,.3);
    background:rgba(0,0,0,.28);
    display:none;
    pointer-events:none;
    z-index:20;
}

#joystick-knob{
    position:absolute;
    left:50%;
    top:50%;
    width:45px;
    height:45px;
    border-radius:50%;
    transform:translate(-50%,-50%);
    background:rgba(255,255,255,.78);
    box-shadow:0 0 8px rgba(0,0,0,.5);
}

.btn{
    position:absolute;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;
    font-weight:bold;
    font-size:12px;

    border-radius:50%;
    border:1.5px solid rgba(255,255,255,.45);

    background:rgba(10,12,16,.52);
    backdrop-filter:blur(5px);

    text-shadow:0 1px 3px #000;
}

.btn:active{
    background:rgba(255,255,255,.22);
}

#btn-fire{
    right:20px;
    bottom:28px;
    width:84px;
    height:84px;
    font-size:14px;
    background:rgba(170,35,35,.68);
    border-color:rgba(255,100,100,.55);
}

#btn-jump{
    right:116px;
    bottom:26px;
    width:59px;
    height:59px;
}

#btn-crouch{
    right:116px;
    bottom:96px;
    width:59px;
    height:59px;
}

#btn-crouch.active{
    background:rgba(35,145,60,.58);
}

#btn-reload{
    right:20px;
    bottom:128px;
    width:59px;
    height:59px;
    background:rgba(160,125,30,.55);
}

#hud{
    position:absolute;
    left:13px;
    top:13px;
    z-index:100;

    color:#fff;
    font-size:15px;
    font-weight:bold;

    padding:8px 12px;
    border-radius:8px;

    background:rgba(0,0,0,.4);
    border:1px solid rgba(255,255,255,.12);

    text-shadow:0 1px 4px #000;
    pointer-events:none;
}

#health{
    margin-top:3px;
    color:#62e56d;
}

#minimap-container{
    position:absolute;
    right:14px;
    top:14px;

    width:108px;
    height:108px;

    z-index:100;

    border-radius:50%;
    overflow:hidden;

    border:2px solid rgba(255,255,255,.72);
    background:rgba(0,0,0,.65);

    pointer-events:none;
}

#minimap{
    width:108px;
    height:108px;
}

#kill-feed{
    position:absolute;
    right:14px;
    top:132px;

    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:5px;

    z-index:100;
    pointer-events:none;
}

.kill-entry{
    color:#ddd;
    font-size:12px;
    padding:5px 9px;
    border-radius:5px;

    background:rgba(0,0,0,.72);
    border:1px solid rgba(255,255,255,.1);
}

.name-player{
    color:#fff;
}

.name-enemy{
    color:#ff7777;
}

#tune-btn{
    position:absolute;
    left:50%;
    top:13px;

    transform:translateX(-50%);

    width:42px;
    height:42px;

    z-index:150;

    border-radius:50%;
    border:1px solid rgba(255,255,255,.4);

    color:#fff;
    background:rgba(0,0,0,.56);

    font-size:18px;
}

#tune-panel{
    position:absolute;

    left:50%;
    top:62px;

    transform:translateX(-50%);

    width:min(365px,94vw);
    max-height:75vh;

    overflow-y:auto;

    padding:11px;

    z-index:150;

    display:none;

    color:#fff;
    font-size:12px;

    background:rgba(8,10,16,.95);
    border:1px solid rgba(255,255,255,.18);
    border-radius:12px;

    box-shadow:0 8px 30px rgba(0,0,0,.5);
}

.tune-title{
    font-size:15px;
    font-weight:bold;
    margin-bottom:9px;
}

.tune-section{
    padding:8px 0;
    margin-bottom:7px;
    border-bottom:1px solid rgba(255,255,255,.1);
}

.tune-row{
    display:flex;
    align-items:center;
    gap:7px;
    margin:5px 0;
}

.tune-row span{
    width:42px;
}

.tune-row input{
    flex:1;
}

.tune-button{
    margin:3px;
    padding:7px 10px;

    color:#fff;
    background:#303846;

    border:1px solid rgba(255,255,255,.2);
    border-radius:7px;
}

.tune-button.selected{
    background:#2465d8;
}

#copy-tune,
#reset-tune{
    color:#fff;
    background:#303846;

    border:1px solid rgba(255,255,255,.25);
    border-radius:7px;

    padding:7px 10px;
    margin:3px;
}
</style>
</head>

<body>

<div id="crosshair"></div>

<div id="touch-move-area"></div>
<div id="touch-look-area"></div>

<div id="joystick-base">
    <div id="joystick-knob"></div>
</div>

<div id="btn-fire" class="btn">ОГОНЬ</div>
<div id="btn-jump" class="btn">ПРЫЖОК</div>
<div id="btn-crouch" class="btn">ПРИСЕСТЬ</div>
<div id="btn-reload" class="btn">R</div>

<div id="hud">
    ПАТРОНЫ: <span id="ammo">12 / 36</span>
    <div id="health">♥ 100</div>
</div>

<div id="minimap-container">
    <canvas id="minimap" width="108" height="108"></canvas>
</div>

<div id="kill-feed"></div>

<button id="tune-btn">⚙</button>

<div id="tune-panel">

    <div class="tune-title">
        Настройка рук / USP
    </div>

    <div class="tune-section">

        <button class="tune-button selected" id="sel-r">
            Правая рука
        </button>

        <button class="tune-button" id="sel-l">
            Левая рука
        </button>

        <button class="tune-button" id="sel-g">
            USP
        </button>

    </div>

    <div class="tune-section">

        <div class="tune-row">
            <span>X</span>
            <input id="px" type="range"
                   min="-0.6" max="0.6"
                   step="0.005">
        </div>

        <div class="tune-row">
            <span>Y</span>
            <input id="py" type="range"
                   min="-0.6" max="0.4"
                   step="0.005">
        </div>

        <div class="tune-row">
            <span>Z</span>
            <input id="pz" type="range"
                   min="-0.8" max="0.3"
                   step="0.005">
        </div>

        <div class="tune-row">
            <span>RotX</span>
            <input id="prx" type="range"
                   min="-1.5" max="1.5"
                   step="0.01">
        </div>

        <div class="tune-row">
            <span>RotY</span>
            <input id="pry" type="range"
                   min="-1.5" max="1.5"
                   step="0.01">
        </div>

        <div class="tune-row">
            <span>RotZ</span>
            <input id="prz" type="range"
                   min="-1.5" max="1.5"
                   step="0.01">
        </div>

    </div>

    <button id="copy-tune">
        Скопировать координаты
    </button>

    <button id="reset-tune">
        Сбросить
    </button>

</div>


<script type="importmap">
{
    "imports":{
        "three":"https://unpkg.com/three@0.160.0/build/three.module.js"
    }
}
</script>


<script type="module">

import * as THREE from "three";


/* =========================================================
   SCENE
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x6eb5dc);

scene.fog = new THREE.Fog(
    0x6eb5dc,
    25,
    70
);


/* CAMERA */

const camera = new THREE.PerspectiveCamera(
    72,
    innerWidth / innerHeight,
    0.05,
    200
);


/* RENDERER */

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   LIGHT
========================================================= */

scene.add(
    new THREE.AmbientLight(
        0x8fa5b5,
        0.65
    )
);

scene.add(
    new THREE.HemisphereLight(
        0xb9dcff,
        0x3c5032,
        0.55
    )
);

const sun =
    new THREE.DirectionalLight(
        0xfff0d0,
        1.15
    );

sun.position.set(
    15,
    30,
    12
);

sun.castShadow = true;

sun.shadow.mapSize.width = 1024;
sun.shadow.mapSize.height = 1024;

scene.add(sun);


/* =========================================================
   PLAYER
========================================================= */

const yawObject =
    new THREE.Object3D();

const pitchObject =
    new THREE.Object3D();

pitchObject.add(camera);
yawObject.add(pitchObject);

yawObject.position.set(
    0,
    1.6,
    9
);

scene.add(yawObject);


/* =========================================================
   MATERIALS
========================================================= */

const skinMat =
    new THREE.MeshStandardMaterial({
        color:0xe8ad7d,
        roughness:.78
    });

const skinLight =
    new THREE.MeshStandardMaterial({
        color:0xf2bd8d,
        roughness:.75
    });

const blackMat =
    new THREE.MeshStandardMaterial({
        color:0x151515,
        roughness:.72
    });

const darkMetal =
    new THREE.MeshStandardMaterial({
        color:0x202326,
        roughness:.28,
        metalness:.8
    });

const slideMat =
    new THREE.MeshStandardMaterial({
        color:0x34373b,
        roughness:.25,
        metalness:.82
    });

const gripMat =
    new THREE.MeshStandardMaterial({
        color:0x101112,
        roughness:.82
    });

const rubberMat =
    new THREE.MeshStandardMaterial({
        color:0x080909,
        roughness:1
    });


/* =========================================================
   VIEWMODEL
========================================================= */

const weaponGroup =
    new THREE.Group();

camera.add(weaponGroup);


const rightHandGroup =
    new THREE.Group();

const leftHandGroup =
    new THREE.Group();

const gunGroup =
    new THREE.Group();


weaponGroup.add(rightHandGroup);
weaponGroup.add(leftHandGroup);
weaponGroup.add(gunGroup);


/* =========================================================
   RIGHT ARM
========================================================= */

/* предплечье */

const rightForearm =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .105,
            .105,
            .30
        ),
        skinMat
    );

rightForearm.position.set(
    .01,
    -.005,
    -.015
);

rightForearm.rotation.set(
    -.18,
    -.06,
    .12
);

rightHandGroup.add(
    rightForearm
);


/* запястье */

const rightWrist =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .095,
            .09,
            .075
        ),
        skinLight
    );

rightWrist.position.set(
    -.005,
    -.045,
    -.16
);

rightHandGroup.add(
    rightWrist
);


/* кисть */

const rightHand =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .105,
            .075,
            .105
        ),
        skinLight
    );

rightHand.position.set(
    -.005,
    -.055,
    -.205
);

rightHand.rotation.z = -.08;

rightHandGroup.add(
    rightHand
);


/* пальцы */

for(let i=0;i<4;i++){

    const finger =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .022,
                .026,
                .065
            ),
            skinLight
        );

    finger.position.set(
        -.035 + i*.023,
        -.058,
        -.255
    );

    rightHandGroup.add(
        finger
    );
}


/* позиция правой руки */

rightHandGroup.position.set(
    .205,
    -.215,
    -.305
);

rightHandGroup.rotation.set(
    -.43,
    -.10,
    .23
);


/* =========================================================
   LEFT ARM
========================================================= */

const leftForearm =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .105,
            .105,
            .29
        ),
        skinMat
    );

leftForearm.rotation.set(
    -.25,
    .35,
    -.18
);

leftHandGroup.add(
    leftForearm
);


const leftWrist =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .095,
            .085,
            .075
        ),
        skinLight
    );

leftWrist.position.set(
    .01,
    -.035,
    -.16
);

leftHandGroup.add(
    leftWrist
);


const leftHand =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .105,
            .075,
            .105
        ),
        skinLight
    );

leftHand.position.set(
    .01,
    -.045,
    -.21
);

leftHandGroup.add(
    leftHand
);


/* пальцы левой руки */

for(let i=0;i<4;i++){

    const finger =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .022,
                .026,
                .065
            ),
            skinLight
        );

    finger.position.set(
        -.035 + i*.023,
        -.048,
        -.258
    );

    leftHandGroup.add(
        finger
    );
}


leftHandGroup.position.set(
    -.015,
    -.245,
    -.39
);

leftHandGroup.rotation.set(
    -.34,
    .46,
    -.16
);


/* =========================================================
   USP
========================================================= */


/* рукоятка */

const grip =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .075,
            .19,
            .095
        ),
        gripMat
    );

grip.position.set(
    0,
    -.095,
    .055
);

grip.rotation.x =
    .24;

gunGroup.add(grip);


/* текстура/полоски рукоятки */

for(let i=0;i<4;i++){

    const line =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .078,
                .012,
                .098
            ),
            rubberMat
        );

    line.position.set(
        0,
        -.045 - i*.035,
        .005
    );

    line.rotation.x=.24;

    gunGroup.add(line);
}


/* рамка */

const frame =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .078,
            .085,
            .235
        ),
        darkMetal
    );

frame.position.set(
    0,
    .015,
    -.025
);

gunGroup.add(frame);


/* верхний затвор */

const slide =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .082,
            .092,
            .335
        ),
        slideMat
    );

slide.position.set(
    0,
    .065,
    -.075
);

gunGroup.add(slide);


/* задняя часть затвора */

const rearSlide =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .086,
            .095,
            .075
        ),
        darkMetal
    );

rearSlide.position.set(
    0,
    .065,
    .105
);

gunGroup.add(
    rearSlide
);


/* насечки затвора */

for(let i=0;i<6;i++){

    const cut =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .088,
                .012,
                .012
            ),
            blackMat
        );

    cut.position.set(
        0,
        .095,
        .075 - i*.022
    );

    gunGroup.add(cut);
}


/* ствол */

const barrel =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .035,
            .035,
            .115
        ),
        darkMetal
    );

barrel.position.set(
    0,
    .035,
    -.285
);

gunGroup.add(barrel);


/* мушка */

const frontSight =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .018,
            .035,
            .022
        ),
        blackMat
    );

frontSight.position.set(
    0,
    .112,
    -.235
);

gunGroup.add(frontSight);


/* целик */

const rearSight =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .035,
            .025,
            .025
        ),
        blackMat
    );

rearSight.position.set(
    0,
    .112,
    .115
);

gunGroup.add(rearSight);


/* магазин */

const magazine =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .05,
            .15,
            .065
        ),
        blackMat
    );

magazine.position.set(
    0,
    -.115,
    .02
);

magazine.rotation.x=.24;

gunGroup.add(
    magazine
);


/* исходная позиция USP */

gunGroup.position.set(
    .17,
    -.16,
    -.46
);


/* =========================================================
   MAP
========================================================= */

const floor =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            90,
            90
        ),
        new THREE.MeshStandardMaterial({
            color:0x416d31,
            roughness:.95
        })
    );

floor.rotation.x =
    -Math.PI/2;

floor.receiveShadow=true;

scene.add(floor);


const wallMat =
    new THREE.MeshStandardMaterial({
        color:0x82552f,
        roughness:.85
    });

const walls=[];


function addWall(
    w,h,d,
    x,y,z
){

    const m =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                w,h,d
            ),
            wallMat
        );

    m.position.set(
        x,y,z
    );

    m.castShadow=true;
    m.receiveShadow=true;

    scene.add(m);

    walls.push({
        mesh:m,
        box:new THREE.Box3()
            .setFromObject(m)
    });
}


addWall(
    9,3.8,1.1,
    -3,1.9,-1
);

addWall(
    1.1,3.8,9,
    5,1.9,-3
);

addWall(
    6,2.2,1.1,
    0,1.1,-10
);

addWall(
    1.1,2.2,5,
    -8,1.1,2
);


/* =========================================================
   CRATES
========================================================= */

const crateMat =
    new THREE.MeshStandardMaterial({
        color:0x6a4525,
        roughness:.86
    });


[
    [-6,1.2,-8],
    [3,1.2,-12],
    [-1,1.2,4],
    [8,1.2,-6]
].forEach(p=>{

    const c =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.4,
                2.4,
                2.4
            ),
            crateMat
        );

    c.position.set(...p);

    c.castShadow=true;
    c.receiveShadow=true;

    scene.add(c);

    walls.push({
        mesh:c,
        box:new THREE.Box3()
            .setFromObject(c)
    });
});


/* =========================================================
   NPC
========================================================= */

function createCharacter(
    team,
    name,
    x,
    z
){

    const g =
        new THREE.Group();

    g.position.set(
        x,
        0,
        z
    );


    const isT =
        team === "T";


    const shirtColor =
        isT ? 0x9c2727 : 0x205a94;


    const pantsColor =
        isT ? 0x29251f : 0x252b31;


    const skin =
        new THREE.MeshStandardMaterial({
            color:0xc9895e,
            roughness:.82
        });


    const shirt =
        new THREE.MeshStandardMaterial({
            color:shirtColor,
            roughness:.65
        });


    const pants =
        new THREE.MeshStandardMaterial({
            color:pantsColor,
            roughness:.82
        });


    const vest =
        new THREE.MeshStandardMaterial({
            color:isT ? 0x242322 : 0x252c30,
            roughness:.9
        });


    const metal =
        new THREE.MeshStandardMaterial({
            color:0x202124,
            roughness:.35,
            metalness:.65
        });


    const boots =
        new THREE.MeshStandardMaterial({
            color:0x101010,
            roughness:.9
        });


    /* ноги */

    [-.14,.14].forEach(
        lx=>{

            const leg =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        .18,
                        .58,
                        .19
                    ),
                    pants
                );

            leg.position.set(
                lx,
                .42,
                0
            );

            leg.userData = {
                bodyPart:"leg",
                enemy:g
            };

            g.add(leg);


            const boot =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        .20,
                        .16,
                        .30
                    ),
                    boots
                );

            boot.position.set(
                lx,
                .12,
                -.045
            );

            g.add(boot);
        }
    );


    /* пояс */

    const belt =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .52,
                .075,
                .31
            ),
            blackMat
        );

    belt.position.y=.77;

    g.add(belt);


    /* корпус */

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .48,
                .62,
                .29
            ),
            shirt
        );

    body.position.set(
        0,
        1.08,
        0
    );

    body.userData={
        bodyPart:"body",
        enemy:g
    };

/* =========================================================
   TOUCH CONTROL
========================================================= */

let moveTouchId=null;
let lookTouchId=null;
let fireTouchId=null;

let touchStart={
    x:0,
    y:0
};

let lookLast={
    x:0,
    y:0
};

let joy={
    x:0,
    y:0
};


const moveArea =
    document.getElementById(
        "touch-move-area"
    );

const lookArea =
    document.getElementById(
        "touch-look-area"
    );

const jsBase =
    document.getElementById(
        "joystick-base"
    );

const jsKnob =
    document.getElementById(
        "joystick-knob"
    );


moveArea.addEventListener(
    "touchstart",
    e=>{

        for(
            const t of e.changedTouches
        ){

            if(
                moveTouchId === null
            ){

                moveTouchId =
                    t.identifier;

                touchStart.x =
                    t.clientX;

                touchStart.y =
                    t.clientY;

                jsBase.style.left =
                    t.clientX+"px";

                jsBase.style.top =
                    t.clientY+"px";

                jsBase.style.display =
                    "block";

                joy.x=0;
                joy.y=0;
            }
        }
    },
    {passive:false}
);


moveArea.addEventListener(
    "touchmove",
    e=>{

        for(
            const t of e.changedTouches
        ){

            if(
                t.identifier ===
                moveTouchId
            ){

                const dx =
                    t.clientX -
                    touchStart.x;

                const dy =
                    t.clientY -
                    touchStart.y;

                const dist =
                    Math.hypot(
                        dx,
                        dy
                    );

                const maxR=43;

                const angle =
                    Math.atan2(
                        dy,
                        dx
                    );

                const cl =
                    Math.min(
                        dist,
                        maxR
                    );

                const x =
                    Math.cos(angle)*cl;

                const y =
                    Math.sin(angle)*cl;

                jsKnob.style.transform =
                    `translate(
                        calc(-50% + ${x}px),
                        calc(-50% + ${y}px)
                    )`;

                joy.x =
                    x/maxR;

                joy.y =
                    y/maxR;
            }
        }
    },
    {passive:false}
);


function resetJoy(e){

    for(
        const t of e.changedTouches
    ){

        if(
            t.identifier ===
            moveTouchId
        ){

            moveTouchId=null;

            jsBase.style.display=
                "none";

            joy.x=0;
            joy.y=0;
        }
    }
}


moveArea.addEventListener(
    "touchend",
    resetJoy
);

moveArea.addEventListener(
    "touchcancel",
    resetJoy
);


/* LOOK */

function handleLook(
    dx,
    dy
){

    yawObject.rotation.y -=
        dx*.0038;

    pitchObject.rotation.x -=
        dy*.0038;

    pitchObject.rotation.x =
        Math.max(
            -1.3,
            Math.min(
                1.3,
                pitchObject.rotation.x
            )
        );
}


lookArea.addEventListener(
    "touchstart",
    e=>{

        for(
            const t of e.changedTouches
        ){

            if(
                lookTouchId===null
            ){

                lookTouchId =
                    t.identifier;

                lookLast.x =
                    t.clientX;

                lookLast.y =
                    t.clientY;
            }
        }
    },
    {passive:false}
);


lookArea.addEventListener(
    "touchmove",
    e=>{

        for(
            const t of e.changedTouches
        ){

            if(
                t.identifier===
                lookTouchId
            ){

                handleLook(
                    t.clientX -
                    lookLast.x,

                    t.clientY -
                    lookLast.y
                );

                lookLast.x =
                    t.clientX;

                lookLast.y =
                    t.clientY;
            }
        }
    },
    {passive:false}
);


function resetLook(e){

    for(
        const t of e.changedTouches
    ){

        if(
            t.identifier===
            lookTouchId
        ){

            lookTouchId=null;
        }
    }
}


lookArea.addEventListener(
    "touchend",
    resetLook
);

lookArea.addEventListener(
    "touchcancel",
    resetLook
);

========================================================= */

let ammo=12;
let reserve=36;

let reloading=false;
let isHoldingFire=false;

let lastFire=0;

const fireRate=170;

let spreadAcc=0;

const raycaster =
    new THREE.Raycaster();

let isCrouching=false;

let isGrounded=true;

let velocityY=0;

const playerR=.38;

let bulletDecals=[];


function updateAmmo(){

    document.getElementById(
        "ammo"
    ).textContent =
        `${ammo} / ${reserve}`;
}


function getSpread(){

    const moving =
        Math.abs(joy.x)>.25 ||
        Math.abs(joy.y)>.25;

    if(!isGrounded)
        return .07;

    if(moving)
        return .028;

    if(isCrouching)
        return .007;

    return .014;
}

document

.addEventListener(

    e=>{

        e.preventDefault();

        if(

            reserve<=0
        )
            return;

        reloading=true;

        document.getElementById(
            "ammo"
        ).textContent=
            "ПЕРЕЗАРЯДКА...";


        setTimeout(
            ()=>{

                const need =
                    12-ammo;

                const take =
                    Math.min(
                        need,
                        reserve
                    );

                ammo += take;
                reserve -= take;

                reloading=false;

                updateAmmo();

        );
    }
);

function createDecal(
    pos,
    normal
){

    const mesh =
        new THREE.Mesh(
            new THREE.CircleGeometry(
                .065,
                8
            ),
            new THREE.MeshBasicMaterial({
                color:0x101010,
                transparent:true,
                opacity:.85,
                side:THREE.DoubleSide,
                depthWrite:false
            })
        );

    mesh.position
        .copy(pos)
        .addScaledVector(
            normal,
            .012
        );

    mesh.lookAt(
        pos.clone()
        .add(normal)
    );

    scene.add(mesh);

    bulletDecals.push({
        mesh:mesh,

    });
}


/* SHOOT */

function shoot(){

    if(
        reloading ||
        ammo<=0
    )
        return;


    ammo--;

    updateAmmo();


    /* recoil */

    pitchObject.rotation.x +=
        .022 +
        Math.random()*.009;

    yawObject.rotation.y +=
        (Math.random()-.5)*.008;


    gunGroup.position.z +=
        .055;

    gunGroup.rotation.x +=
        .045;


    const spread =
        getSpread();

    spreadAcc =
        Math.min(
            spreadAcc+
            spread*.55,
            spread*1.7
        );


    const sx =
        (Math.random()-.5) *
        spreadAcc;

    const sy =
        (Math.random()-.5) *
        spreadAcc;


    raycaster.setFromCamera(
        new THREE.Vector2(
            sx,
            sy
        ),
        camera
    );


    const targets=[];


    enemies.forEach(
        e=>{

            if(
                !e.userData.isDead
            ){

                e.traverse(
                    c=>{

                        if(
                            c.isMesh
                        )
                            targets.push(c);
                    }
                );
            }
        }
    );


    walls.forEach(
        w=>
            targets.push(
                w.mesh
            )
    );


    const hits =
        raycaster.intersectObjects(
            targets,
            false
        );


    if(!hits.length)
        return;


    const hit =
        hits[0];


    if(
        hit.object.userData &&
        hit.object.userData.enemy
    ){

        const enemy =
            hit.object
            .userData
            .enemy;

        const part =
            hit.object
            .userData
            .bodyPart ||
            "body";


        if(
            enemy.userData.isDead
        )
            return;


        let damage=25;


        if(part==="head"){

            damage =
                100;
        }
        else if(
            part==="body"
        ){

            damage =
                25+
                Math.floor(
                    Math.random()*16
                );
        }
        else{

            damage =
                12+
                Math.floor(
                    Math.random()*13
                );
        }


        enemy.userData.hp -=
            damage;


        if(
            enemy.userData.hp<=0
        ){

            enemy.userData.isDead=
                true;

            enemy.rotation.x=
                -Math.PI/2;

            enemy.position.y=
                .18;


            addKill(
                "Игрок",
                enemy.userData.name
            );


            setTimeout(
                ()=>{

                    enemy.userData.isDead=
                        false;

                    enemy.userData.hp=
                        100;

                    enemy.rotation.x=0;

                    enemy.position.copy(
                        enemy.userData.spawnPos
                    );

                },
                3200
            );
        }

    }
    else if(hit.face){

        createDecal(
            hit.point,
            hit.face.normal
        );
    }
}

/* =========================================================
   MINIMAP
========================================================= */

const ctx=
    document
    .getElementById(
        "minimap"
    )
    .getContext("2d");


function updateMinimap(){

    ctx.clearRect(
        0,
        0,
        108,
        108
    );


    const cx=54;
    const cy=54;

    const scale=2.7;

    const rot=
        yawObject.rotation.y;


    /* фон */

    ctx.fillStyle=
        "rgba(0,0,0,.3)";

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        52,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* направление */

    ctx.strokeStyle=
        "rgba(255,255,255,.55)";

    ctx.lineWidth=1.5;

    ctx.beginPath();

    ctx.moveTo(
        cx,
        cy
    );

    ctx.lineTo(
        cx-18,
        cy-28
    );

    ctx.moveTo(
        cx,
        cy
    );

    ctx.lineTo(
        cx+18,
        cy-28
    );

    ctx.stroke();


    /* игрок */

    ctx.fillStyle="#fff";

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        3.5,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* враги */

    enemies.forEach(
        e=>{

            if(
                e.userData.isDead
            )
                return;


            const dx=
                e.position.x -
                yawObject.position.x;

            const dz=
                e.position.z -
                yawObject.position.z;


            const mx=
                cx+
                (
                    dx*Math.cos(rot)+
                    dz*Math.sin(rot)
                )*
                scale;


            const my=
                cy+
                (
                    -dx*Math.sin(rot)+
                    dz*Math.cos(rot)
                )*
                scale;


            if(
                mx<2 ||
                mx>106 ||
                my<2 ||
                my>106
            )
                return;


            ctx.fillStyle=
                "#ff3333";

            ctx.beginPath();

            ctx.arc(
                mx,
                my,
                3.5,
                0,
                Math.PI*2
            );

            ctx.fill();
        }
    );
}


/* =========================================================
   COLLISION
========================================================= */

function canMoveTo(pos){

    for(
        const w of walls
    ){

        const b=w.box;

        if(
            pos.x >
                b.min.x-playerR &&

            pos.x <
                b.max.x+playerR &&

            pos.z >
                b.min.z-playerR &&

            pos.z <
                b.max.z+playerR
        ){

            return false;
        }
    }


    for(
        const e of enemies
    ){

        if(
            e.userData.isDead
        )
            continue;


        if(
            Math.hypot(
                pos.x-e.position.x,
                pos.z-e.position.z
            )
            <
            playerR+.4
        )
            return false;
    }


    return true;
}


/* =========================================================
   GAME LOOP
========================================================= */

let lastTime=
    performance.now();


let targetHeight={
    current:1.6
};


function animate(){

    requestAnimationFrame(
        animate
    );


    const now=
        performance.now();


    const dt=
        Math.min(
            (now-lastTime)/1000,
            .09
        );


    lastTime=now;


    /* fire */

    if(
        isHoldingFire &&
        now-lastFire>fireRate
    ){

        shoot();

        lastFire=now;
    }


    /* recoil return */

    gunGroup.position.z +=
        (
            defaults.g.z -
            gunGroup.position.z
        )*.12;


    gunGroup.rotation.x +=
        (
            defaults.g.rx -
            gunGroup.rotation.x
        )*.12;


    spreadAcc=
        Math.max(
            0,
            spreadAcc-dt*.14
        );


    /* decals */

    for(
        let i=
            bulletDecals.length-1;

        i>=0;

        i--
    ){

        const d=
            bulletDecals[i];

        d.life-=dt;

        if(
            d.life<=0
        ){

            scene.remove(
                d.mesh
            );

            bulletDecals.splice(
                i,
                1
            );

        }
        else{

            d.mesh.material.opacity=
                Math.min(
                    .85,
                    d.life*.4
                );
        }
    }


    /* crouch */

    const desiredY=
        isCrouching
        ?.92
        :1.6;


    targetHeight.current +=
        (
            desiredY-
            targetHeight.current
        )*
        11*
        dt;


    /* movement */

    const speed=
        isCrouching
        ?3.3
        :6.8;


    const forward=
        new THREE.Vector3(
            0,
            0,
            -1
        )
        .applyQuaternion(
            yawObject.quaternion
        );


    const side=
        new THREE.Vector3(
            1,
            0,
            0
        )
        .applyQuaternion(
            yawObject.quaternion
        );


    forward.y=0;
    side.y=0;

    forward.normalize();
    side.normalize();


    const mx=
        (
            forward.x*
            -joy.y+

            side.x*
            joy.x
        )*
        speed*
        dt;


    const mz=
        (
            forward.z*
            -joy.y+

            side.z*
            joy.x
        )*
        speed*
        dt;


    const nextX=
        yawObject.position.clone();

    nextX.x+=mx;


    if(
        canMoveTo(nextX)
    ){

        yawObject.position.x=
            nextX.x;
    }


    const nextZ=
        yawObject.position.clone();

    nextZ.z+=mz;


    if(
        canMoveTo(nextZ)
    ){

        yawObject.position.z=
            nextZ.z;
    }


    /* jump */

    velocityY -=
        19.5*dt;

    yawObject.position.y +=
        velocityY*dt;


    if(
        yawObject.position.y <=
        targetHeight.current
    ){

        yawObject.position.y=
            targetHeight.current;

        velocityY=0;

        isGrounded=true;
    }


    updateMinimap();


    renderer.render(
        scene,
        camera
    );
}


animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);


updateAmmo();

</script>
