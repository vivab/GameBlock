<!doctype html><html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/><meta name="theme-color" content="#111827"/><title>GameBlock Alpha</title><style>html,body{margin:0;overflow:hidden;background:#101820;color:white;font:14px Arial;touch-action:none;user-select:none}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none}#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:24px;color:#fff;text-shadow:0 0 3px black}#stats{position:absolute;bottom:12px;left:42%;font-weight:bold;text-shadow:0 1px 3px black}#info{position:absolute;top:12px;left:12px;text-shadow:0 1px 3px black}#radar{position:absolute;top:12px;right:12px;border:2px solid #ffffff66;border-radius:50%;background:#0a1a21bb}#joy{position:absolute;bottom:35px;left:25px;width:125px;height:125px;border:2px solid #ffffff55;border-radius:50%;background:#ffffff16;pointer-events:auto;touch-action:none}#knob{position:absolute;left:42px;top:42px;width:40px;height:40px;border-radius:50%;background:#ffffff88}button{position:absolute;pointer-events:auto;border:1px solid #ffffff77;background:#253b52bd;color:white;border-radius:50%;width:65px;height:65px;font-weight:bold;touch-action:none}#fire{right:20px;bottom:115px;width:88px;height:88px;background:#b94b49aa}#jump{right:120px;bottom:40px}#crouch{right:20px;bottom:20px}#reload{right:125px;bottom:145px}#hint{position:absolute;top:45px;left:12px;color:#ddd;font-size:12px}</style></head><body><div id="hud"><div id="info">GameBlock • Alpha 0.1</div><div id="hint">Левая сторона: движение • правая: обзор</div><canvas id="radar" width="150" height="150"></canvas><div id="cross">+</div><div id="stats">HP 100 | 30 / 90</div><div id="joy"><div id="knob"></div></div><button id="fire">ОГОНЬ</button><button id="jump">↑</button><button id="crouch">ПРИСЕД</button><button id="reload">↻</button></div><script type="module" src="./src/main.js"></script></body></html>
