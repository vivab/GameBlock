<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Block Strike Mobile - Full Updated Version</title>
    <style>
        * { touch-action: none; user-select: none; -webkit-user-select: none; box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Arial', sans-serif; }

        /* Прицел */
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 12px; height: 12px; margin: -6px 0 0 -6px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%; pointer-events: none; z-index: 10;
        }
        #crosshair::after {
            content: ''; position: absolute; top: 4px; left: 4px;
            width: 2px; height: 2px; background: red; border-radius: 50%;
        }

        /* Сенсорные зоны */
        #touch-move-area { position: absolute; left: 0; top: 0; width: 50%; height: 100%; z-index: 5; }
        #touch-look-area { position: absolute; right: 0; top: 0; width: 50%; height: 100%; z-index: 5; }

        /* Джойстик */
        #joystick-base {
            position: absolute; width: 100px; height: 100px;
            border: 3px solid rgba(255, 255, 255, 0.4); border-radius: 50%;
            background: rgba(0, 0, 0, 0.25); display: none; pointer-events: none; z-index: 6;
            transform: translate(-50%, -50%);
        }
        #joystick-knob {
            position: absolute; top: 50%; left: 50%; width: 40px; height: 40px;
            background: rgba(255, 255, 255, 0.7); border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none;
        }

        /* Кнопки */
        .btn {
            position: absolute; z-index: 20;
            background: rgba(0, 0, 0, 0.5); border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%; color: white; font-weight: bold; font-size: 13px;
            display: flex; align-items: center; justify-content: center;
        }
        .btn:active { background: rgba(255, 255, 255, 0.4); }

        #btn-fire { right: 25px; bottom: 35px; width: 75px; height: 75px; background: rgba(220, 50, 50, 0.6); font-size: 15px; }
        #btn-jump { right: 115px; bottom: 25px; width: 55px; height: 55px; }
        #btn-crouch { right: 115px; bottom: 90px; width: 55px; height: 55px; }
        #btn-crouch.active { background: rgba(50, 200, 50, 0.6); }
        #btn-reload { right: 25px; bottom: 125px; width: 60px; height: 60px; background: rgba(200, 150, 30, 0.6); }

        /* HUD & Мини-карта */
        #hud {
            position: absolute; top: 15px; left: 15px; z-index: 20;
            color: white; font-weight: bold; text-shadow: 2px 2px 4px #000;
            font-size: 15px; pointer-events: none;
        }
        #minimap-container {
            position: absolute; top: 15px; right: 15px; z-index: 20;
            width: 120px; height: 120px; border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.7); overflow: hidden;
            background: rgba(0, 0, 0, 0.6); pointer-events: none;
        }
        #minimap { width: 100%; height: 100%; }

        /* Лог попаданий и Уведомление об убийстве */
        #hit-log {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            color: #ff3333; font-weight: bold; font-size: 20px;
            text-shadow: 2px 2px 4px #000; opacity: 0; transition: opacity 0.2s;
            pointer-events: none; z-index: 20; text-align: center;
        }
        #kill-banner {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75); border: 1px solid rgba(255,255,255,0.4);
            color: #fff; padding: 8px 16px; border-radius: 8px; font-weight: bold;
            font-size: 14px; z-index: 30; display: none; text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #kill-banner span.weapon { color: #ffcc00; }
        #kill-banner span.victim { color: #ff5555; }
    </style>
</head>
<body>

    <div id="crosshair"></div>
    <div id="touch-move-area"></div>
    <div id="touch-look-area"></div>

    <div id="joystick-base"><div id="joystick-knob"></div></div>
    <div id="btn-fire" class="btn">ОГОНЬ</div>
    <div id="btn-jump" class="btn">ПРЫЖОК</div>
    <div id="btn-crouch" class="btn">ПРИСЕСТЬ</div>
    <div id="btn-reload" class="btn">R</div>

    <div id="hud">
        ПА ТРОНЫ: <span id="ammo">12 / 36</span><br>
        СТАТУС: <span id="state-text">Стоит</span>
    </div>

    <!-- Мини-карта -->
    <div id="minimap-container">
        <canvas id="minimap" width="120" height="120"></canvas>
    </div>

    <div id="hit-log">ГОЛОВА! -70 HP</div>
    <div id="kill-banner">Игрок ➔ <span class="weapon">Glock 17 (Default)</span> ➔ <span class="victim">Бот #1</span></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- 1. СЦЕНА И КАМЕРА ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7ec0ee);
        scene.fog = new THREE.Fog(0x7ec0ee, 20, 60);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);
        scene.add(new THREE.AmbientLight(0x707070));

        const yawObject = new THREE.Object3D();
        const pitchObject = new THREE.Object3D();
        pitchObject.add(camera);
        yawObject.add(pitchObject);
        yawObject.position.set(0, 1.6, 8);
        scene.add(yawObject);

        // --- 2. МОДЕЛЬКА ОРУЖИЯ (VIEWMODEL) ---
        const weaponGroup = new THREE.Group();
        camera.add(weaponGroup);

        const skinMat = new THREE.MeshStandardMaterial({ color: 0xffcd94 });
        const gunBodyMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.3 });
        const gunGripMat = new THREE.MeshStandardMaterial({ color: 0x111111 });

        const rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.35), skinMat);
        rightArm.position.set(0.2, -0.18, -0.3);
        weaponGroup.add(rightArm);

        const leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.35), skinMat);
        leftArm.position.set(-0.15, -0.22, -0.35);
        leftArm.rotation.y = 0.2;
        weaponGroup.add(leftArm);

        const gunGrip = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.15, 0.07), gunGripMat);
        gunGrip.position.set(0.18, -0.12, -0.4);
        gunGrip.rotation.x = 0.2;
        weaponGroup.add(gunGrip);

        const gunSlide = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.07, 0.28), gunBodyMat);
        gunSlide.position.set(0.18, -0.05, -0.45);
        weaponGroup.add(gunSlide);

        weaponGroup.position.set(0.05, -0.05, 0);

        // --- 3. КАРТА И МОДЕЛИ ИГРОКОВ (T и CT) ---
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(100, 100),
            new THREE.MeshStandardMaterial({ color: 0x406020 })
        );
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Препятствия для проверки видимости
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
        const wall1 = new THREE.Mesh(new THREE.BoxGeometry(8, 4, 1), wallMat);
        wall1.position.set(-2, 2, 0);
        scene.add(wall1);

        const wall2 = new THREE.Mesh(new THREE.BoxGeometry(1, 4, 8), wallMat);
        wall2.position.set(4, 2, -2);
        scene.add(wall2);

        const worldObstacles = [floor, wall1, wall2];

        // Улучшенная сборка модели персонажа (Т или СТ)
        function createCharacter(team, name, x, z) {
            const group = new THREE.Group();
            group.position.set(x, 0, z);

            // Цвета по ТЗ:
            // T: Красная куртка, чёрные штаны, чёрная обувь
            // CT: Синяя куртка, чёрные штаны, чёрная обувь
            const coatColor = (team === 'T') ? 0xd32f2f : 0x1976d2;
            const matJacket = new THREE.MeshStandardMaterial({ color: coatColor, roughness: 0.5 });
            const matPants = new THREE.MeshStandardMaterial({ color: 0x151515 });
            const matShoes = new THREE.MeshStandardMaterial({ color: 0x050505 });
            const matHead = new THREE.MeshStandardMaterial({ color: 0xffcd94 });

            // 1. Голова
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.38, 0.38), matHead);
            head.position.set(0, 1.6, 0);
            head.userData = { bodyPart: 'head', enemy: group };
            group.add(head);

            // 2. Тело (Куртка)
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.65, 0.28), matJacket);
            body.position.set(0, 1.1, 0);
            body.userData = { bodyPart: 'body', enemy: group };
            group.add(body);

            // 3. Руки (Куртка + Кисти)
            [-0.36, 0.36].forEach(armX => {
                const arm = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.6, 0.18), matJacket);
                arm.position.set(armX, 1.08, 0);
                arm.userData = { bodyPart: 'arm', enemy: group };
                group.add(arm);
            });

            // 4. Ноги (Штаны)
            [-0.14, 0.14].forEach(legX => {
                const leg = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.6, 0.2), matPants);
                leg.position.set(legX, 0.45, 0);
                leg.userData = { bodyPart: 'leg', enemy: group };
                group.add(leg);

                // Обувь
                const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.15, 0.26), matShoes);
                shoe.position.set(legX, 0.08, 0.03);
                group.add(shoe);
            });

            group.userData = {
                hp: 100,
                name: name,
                team: team,
                spawnPos: new THREE.Vector3(x, 0, z),
                isDead: false,
                lastSeenPos: null,
                lastSeenTime: 0,
                isVisible: false
            };

            scene.add(group);
            return group;
        }

        const enemies = [
            createCharacter('T', 'Бот Террорист #1', -3, -6),
            createCharacter('T', 'Бот Террорист #2', 2, -10),
            createCharacter('CT', 'Бот Спецназ #1', 6, -4)
        ];

        // --- 4. СЕНСОРНОЕ УПРАВЛЕНИЕ И СТРЕЛЬБА ---
        let moveTouchId = null, lookTouchId = null, fireTouchId = null;
        let touchStartPos = { x: 0, y: 0 };
        let joystickVector = { x: 0, y: 0 };
        let lookLastPos = { x: 0, y: 0 };

        const moveArea = document.getElementById('touch-move-area');
        const lookArea = document.getElementById('touch-look-area');
        const jsBase = document.getElementById('joystick-base');
        const jsKnob = document.getElementById('joystick-knob');
        const btnFire = document.getElementById('btn-fire');

        // Левая область - Джойстик
        moveArea.addEventListener('touchstart', (e) => {
            for (let t of e.changedTouches) {
                if (moveTouchId === null) {
                    moveTouchId = t.identifier;
                    touchStartPos = { x: t.clientX, y: t.clientY };
                    jsBase.style.left = t.clientX + 'px';
                    jsBase.style.top = t.clientY + 'px';
                    jsBase.style.display = 'block';
                    jsKnob.style.transform = `translate(-50%, -50%)`;
                    joystickVector = { x: 0, y: 0 };
                }
            }
        });

        moveArea.addEventListener('touchmove', (e) => {
            for (let t of e.changedTouches) {
                if (t.identifier === moveTouchId) {
                    const dx = t.clientX - touchStartPos.x;
                    const dy = t.clientY - touchStartPos.y;
                    const dist = Math.hypot(dx, dy);
                    const maxR = 40;
                    const angle = Math.atan2(dy, dx);
                    const clampedDist = Math.min(dist, maxR);

                    const knobX = Math.cos(angle) * clampedDist;
                    const knobY = Math.sin(angle) * clampedDist;
                    jsKnob.style.transform = `translate(calc(-50% + ${knobX}px), calc(-50% + ${knobY}px))`;

                    joystickVector.x = knobX / maxR;
                    joystickVector.y = knobY / maxR;
                }
            }
        });

        const resetJoystick = (e) => {
            for (let t of e.changedTouches) {
                if (t.identifier === moveTouchId) {
                    moveTouchId = null;
                    jsBase.style.display = 'none';
                    joystickVector = { x: 0, y: 0 };
                }
            }
        };
        moveArea.addEventListener('touchend', resetJoystick);
        moveArea.addEventListener('touchcancel', resetJoystick);

        // Правая область - Обзор и контроль отдачи
        function handleCameraLook(dx, dy) {
            yawObject.rotation.y -= dx * 0.004;
            pitchObject.rotation.x -= dy * 0.004;
            pitchObject.rotation.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitchObject.rotation.x));
        }

        lookArea.addEventListener('touchstart', (e) => {
            for (let t of e.changedTouches) {
                if (lookTouchId === null) {
                    lookTouchId = t.identifier;
                    lookLastPos = { x: t.clientX, y: t.clientY };
                }
            }
        });

        lookArea.addEventListener('touchmove', (e) => {
            for (let t of e.changedTouches) {
                if (t.identifier === lookTouchId) {
                    const dx = t.clientX - lookLastPos.x;
                    const dy = t.clientY - lookLastPos.y;
                    handleCameraLook(dx, dy);
                    lookLastPos = { x: t.clientX, y: t.clientY };
                }
            }
        });

        const resetLook = (e) => {
            for (let t of e.changedTouches) {
                if (t.identifier === lookTouchId) lookTouchId = null;
            }
        };
        lookArea.addEventListener('touchend', resetLook);
        lookArea.addEventListener('touchcancel', resetLook);

        // Кнопка Огонь (Удержание + Контроль отдачи пальцем)
        let isHoldingFire = false;
        let lastFireTime = 0;
        const fireRate = 180; // Задержка между выстрелами (мс)

        btnFire.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isHoldingFire = true;
            for (let t of e.changedTouches) {
                fireTouchId = t.identifier;
                lookLastPos = { x: t.clientX, y: t.clientY };
            }
        });

        btnFire.addEventListener('touchmove', (e) => {
            for (let t of e.changedTouches) {
                if (t.identifier === fireTouchId) {
                    const dx = t.clientX - lookLastPos.x;
                    const dy = t.clientY - lookLastPos.y;
                    handleCameraLook(dx, dy); // Управление отдачей
                    lookLastPos = { x: t.clientX, y: t.clientY };
                }
            }
        });

        const stopFire = (e) => {
            for (let t of e.changedTouches) {
                if (t.identifier === fireTouchId) {
                    isHoldingFire = false;
                    fireTouchId = null;
                }
            }
        };
        btnFire.addEventListener('touchend', stopFire);
        btnFire.addEventListener('touchcancel', stopFire);

        // --- 5. ГЕЙМПЛЕЙ: ОТДАЧА, РАЗБРОС, УРОН И КИЛЛФИД ---
        let currentAmmo = 12, reserveAmmo = 36, isReloading = false;
        let spreadAcc = 0; // Накопление разброса
        const raycaster = new THREE.Raycaster();

        function updateAmmoUI() {
            document.getElementById('ammo').innerText = `${currentAmmo} / ${reserveAmmo}`;
        }

        // Перезарядка
        document.getElementById('btn-reload').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (isReloading || currentAmmo === 12 || reserveAmmo <= 0) return;
            isReloading = true;
            document.getElementById('ammo').innerText = "ПЕРЕЗАРЯДКА...";
            setTimeout(() => {
                const needed = 12 - currentAmmo;
                const toAdd = Math.min(needed, reserveAmmo);
                currentAmmo += toAdd;
                reserveAmmo -= toAdd;
                isReloading = false;
                updateAmmoUI();
            }, 1200);
        });

        // Показ лога выстрела
        const hitLog = document.getElementById('hit-log');
        let hitTimeout;
        function showHitText(text, color = "#ff3333") {
            hitLog.innerText = text;
            hitLog.style.color = color;
            hitLog.style.opacity = '1';
            clearTimeout(hitTimeout);
            hitTimeout = setTimeout(() => hitLog.style.opacity = '0', 600);
        }

        // Показ плашки убийства
        function showKillBanner(killer, weapon, victim) {
            const banner = document.getElementById('kill-banner');
            banner.innerHTML = `${killer} ➔ <span class="weapon">${weapon} (Default)</span> ➔ <span class="victim">${victim}</span>`;
            banner.style.display = 'block';
            setTimeout(() => banner.style.display = 'none', 2500);
        }

        // Выстрел
        function shootPistol() {
            if (isReloading) return;
            if (currentAmmo <= 0) {
                showHitText("НЕТ ПАТРОНОВ!", "#ffff00");
                return;
            }

            currentAmmo--;
            updateAmmoUI();

            // 1. Отдача (Подбрасывает камеру вверх)
            pitchObject.rotation.x += 0.025;
            weaponGroup.position.z = 0.08;

            // 2. Накопление разброса пуль
            spreadAcc = Math.min(spreadAcc + 0.015, 0.05);
            const spreadX = (Math.random() - 0.5) * spreadAcc;
            const spreadY = (Math.random() - 0.5) * spreadAcc;

            raycaster.setFromCamera(new THREE.Vector2(spreadX, spreadY), camera);

            // Сбор всех живых хитбоксов
            let hitboxes = [];
            enemies.forEach(e => {
                if (!e.userData.isDead) hitboxes.push(...e.children);
            });

            const intersects = raycaster.intersectObjects(hitboxes);

            if (intersects.length > 0) {
                const hitMesh = intersects[0].object;
                const part = hitMesh.userData.bodyPart;
                const enemy = hitMesh.userData.enemy;

                let damage = 0, partName = "";
                if (part === 'head') { damage = 70; partName = "ГОЛОВА"; }
                else if (part === 'body') { damage = Math.floor(Math.random() * 31) + 20; partName = "ТЕЛО"; }
                else if (part === 'arm') { damage = Math.floor(Math.random() * 16) + 10; partName = "РУКА"; }
                else if (part === 'leg') { damage = Math.floor(Math.random() * 16) + 10; partName = "НОГА"; }

                enemy.userData.hp -= damage;
                showHitText(`${partName}! -${damage} HP`);

                // Убийство и Респавн
                if (enemy.userData.hp <= 0 && !enemy.userData.isDead) {
                    enemy.userData.isDead = true;
                    enemy.rotation.x = -Math.PI / 2;
                    enemy.position.y = 0.2;

                    showKillBanner("Игрок", "Glock 17", enemy.userData.name);

                    // Респавн через 3 секунды
                    setTimeout(() => {
                        enemy.userData.isDead = false;
                        enemy.userData.hp = 100;
                        enemy.rotation.x = 0;
                        enemy.position.copy(enemy.userData.spawnPos);
                    }, 3000);
                }
            }
        }

        // --- 6. РАДАР / МИНИ-КАРТА ---
        const canvas = document.getElementById('minimap');
        const ctx = canvas.getContext('2d');

        function updateMinimap(now) {
            ctx.clearRect(0, 0, 120, 120);

            const mapCenterX = 60, mapCenterY = 60;
            const scale = 3.5; // Масштаб отображения

            // 1. Линии обзора игрока
            const playerRot = yawObject.rotation.y;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(mapCenterX, mapCenterY);
            ctx.lineTo(mapCenterX + Math.sin(playerRot - 0.5) * 40, mapCenterY - Math.cos(playerRot - 0.5) * 40);
            ctx.moveTo(mapCenterX, mapCenterY);
            ctx.lineTo(mapCenterX + Math.sin(playerRot + 0.5) * 40, mapCenterY - Math.cos(playerRot + 0.5) * 40);
            ctx.stroke();

            // Маркер игрока (Белая точка)
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(mapCenterX, mapCenterY, 3, 0, Math.PI * 2);
            ctx.fill();

            // 2. Враги на радаре
            const eyePos = yawObject.position.clone();
            eyePos.y += 0.8;

            enemies.forEach(enemy => {
                if (enemy.userData.isDead) return;

                // Проверка видимости (Raycast от игрока к врагу)
                const enemyHeadPos = enemy.position.clone();
                enemyHeadPos.y += 1.6;

                const dir = enemyHeadPos.clone().sub(eyePos).normalize();
                const dist = eyePos.distanceTo(enemyHeadPos);

                const losRay = new THREE.Raycaster(eyePos, dir, 0, dist - 0.2);
                const blocks = losRay.intersectObjects(worldObstacles);

                const isVisible = (blocks.length === 0);

                if (isVisible) {
                    enemy.userData.lastSeenPos = enemy.position.clone();
                    enemy.userData.lastSeenTime = now;
                    enemy.userData.isVisible = true;
                } else {
                    enemy.userData.isVisible = false;
                }

                // Отрисовка маркеров
                const dx = (enemy.position.x - yawObject.position.x) * scale;
                const dz = (enemy.position.z - yawObject.position.z) * scale;
                const mapX = mapCenterX + dx;
                const mapY = mapCenterY + dz;

                if (enemy.userData.isVisible) {
                    // Красная закрашенная точка (Видим прямо сейчас)
                    ctx.fillStyle = '#ff0000';
                    ctx.beginPath();
                    ctx.arc(mapX, mapY, 3.5, 0, Math.PI * 2);
                    ctx.fill();
                } else if (enemy.userData.lastSeenPos) {
                    // Исчезающее колечко на месте последнего контакта (до 3 сек)
                    const timeSince = now - enemy.userData.lastSeenTime;
                    if (timeSince < 3000) {
                        const alpha = 1.0 - (timeSince / 3000);
                        const lastDx = mapCenterX + (enemy.userData.lastSeenPos.x - yawObject.position.x) * scale;
                        const lastDz = mapCenterY + (enemy.userData.lastSeenPos.z - yawObject.position.z) * scale;

                        ctx.strokeStyle = `rgba(255, 0, 0, ${alpha})`;
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(lastDx, lastDz, 4, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                }
            });
        }

        // --- 7. ДВИЖЕНИЕ И ПРИСЕДАНИЕ ---
        let velocityY = 0, isGrounded = true, isCrouching = false;
        const targetHeight = { current: 1.6 };

        const btnCrouch = document.getElementById('btn-crouch');
        btnCrouch.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isCrouching = !isCrouching;
            btnCrouch.classList.toggle('active', isCrouching);
            document.getElementById('state-text').innerText = isCrouching ? "Сидит" : "Стоит";
        });

        document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (isGrounded) { velocityY = 8.0; isGrounded = false; }
        });

        // --- 8. ГЛАВНЫЙ ИГРОВОЙ ЦИКЛ ---
        let lastTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = Math.min((time - lastTime) / 1000, 0.1);
            lastTime = time;

            // Стрельба зажатием
            if (isHoldingFire && (time - lastFireTime > fireRate)) {
                shootPistol();
                lastFireTime = time;
            }

            // Гашение отдачи и разброса
            weaponGroup.position.z += (0.05 - weaponGroup.position.z) * 0.2;
            spreadAcc = Math.max(0, spreadAcc - delta * 0.1);

            // Приседание
            const desiredY = isCrouching ? 0.9 : 1.6;
            targetHeight.current += (desiredY - targetHeight.current) * 10.0 * delta;

            // Движение
            const speed = isCrouching ? 3.5 : 7.0;
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(yawObject.quaternion);
            const side = new THREE.Vector3(1, 0, 0).applyQuaternion(yawObject.quaternion);
            forward.y = 0; forward.normalize();
            side.y = 0; side.normalize();

            yawObject.position.addScaledVector(forward, -joystickVector.y * speed * delta);
            yawObject.position.addScaledVector(side, joystickVector.x * speed * delta);

            // Гравитация
            velocityY -= 22.0 * delta;
            yawObject.position.y += velocityY * delta;

            if (yawObject.position.y <= targetHeight.current) {
                yawObject.position.y = targetHeight.current;
                velocityY = 0;
                isGrounded = true;
            }

            // Обновление радара
            updateMinimap(time);

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
