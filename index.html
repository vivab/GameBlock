<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Block Strike Style</title>
    <style>
        * { touch-action: none; user-select: none; -webkit-user-select: none; box-sizing: border-box; margin: 0; padding: 0; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }

        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 8px; height: 8px; margin: -4px 0 0 -4px;
            border: 1.5px solid rgba(255,255,255,0.9);
            border-radius: 50%; pointer-events: none; z-index: 15;
            box-shadow: 0 0 3px #000;
        }
        #crosshair::after {
            content: ''; position: absolute; top: 2.5px; left: 2.5px;
            width: 2px; height: 2px; background: #ff3b3b; border-radius: 50%;
        }

        #touch-move-area { position: absolute; left: 0; top: 0; width: 50%; height: 100%; z-index: 5; }
        #touch-look-area { position: absolute; right: 0; top: 0; width: 50%; height: 100%; z-index: 5; }

        #joystick-base {
            position: absolute; width: 110px; height: 110px;
            border: 2px solid rgba(255,255,255,0.35); border-radius: 50%;
            background: rgba(0,0,0,0.3); display: none; pointer-events: none; z-index: 6;
            transform: translate(-50%, -50%);
        }
        #joystick-knob {
            position: absolute; top: 50%; left: 50%; width: 44px; height: 44px;
            background: rgba(255,255,255,0.8); border-radius: 50%;
            transform: translate(-50%, -50%); box-shadow: 0 0 8px rgba(0,0,0,0.4);
        }

        .btn {
            position: absolute; z-index: 20;
            background: rgba(15,15,20,0.55); border: 1.5px solid rgba(255,255,255,0.45);
            border-radius: 50%; color: #fff; font-weight: 700; font-size: 12px;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(4px);
        }
        .btn:active { background: rgba(255,255,255,0.25); }

        #btn-fire {
            right: 22px; bottom: 32px; width: 82px; height: 82px;
            background: rgba(180,40,40,0.65); border-color: rgba(255,100,100,0.5); font-size: 14px;
        }
        #btn-jump { right: 118px; bottom: 28px; width: 58px; height: 58px; }
        #btn-crouch { right: 118px; bottom: 96px; width: 58px; height: 58px; }
        #btn-crouch.active { background: rgba(40,160,60,0.55); border-color: rgba(80,220,100,0.7); }
        #btn-reload { right: 22px; bottom: 130px; width: 58px; height: 58px; background: rgba(180,140,30,0.55); }

        #hud {
            position: absolute; top: 14px; left: 14px; z-index: 20;
            color: #fff; font-weight: 700; text-shadow: 0 1px 4px #000;
            font-size: 15px; pointer-events: none;
            background: rgba(0,0,0,0.35); padding: 8px 12px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        #minimap-container {
            position: absolute; top: 14px; right: 14px; z-index: 20;
            width: 108px; height: 108px; border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.7); overflow: hidden;
            background: rgba(0,0,0,0.6); box-shadow: 0 0 12px rgba(0,0,0,0.5);
        }
        #minimap { width: 100%; height: 100%; }

        #kill-feed {
            position: absolute; top: 135px; right: 14px; z-index: 20;
            display: flex; flex-direction: column; align-items: flex-end; gap: 5px;
            pointer-events: none;
        }
        .kill-entry {
            background: rgba(0,0,0,0.72); padding: 5px 11px; border-radius: 5px;
            font-size: 12.5px; font-weight: 600; color: #ccc;
            border: 1px solid rgba(255,255,255,0.12); text-shadow: 0 1px 2px #000;
            animation: fadeIn 0.25s ease;
        }
        .name-white { color: #fff; }
        .name-other { color: #ff8a8a; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="touch-move-area"></div>
    <div id="touch-look-area"></div>

    <div id="joystick-base"><div id="joystick-knob"></div></div>
    <div id="btn-fire" class="btn">ОГОНЬ</div>
    <div id="btn-jump" class="btn">ПРЫЖОК</div>
    <div id="btn-crouch" class="btn">ПРИСЕСТЬ</div>
    <div id="btn-reload" class="btn">R</div>

    <div id="hud">ПАТРОНЫ: <span id="ammo">7 / 21</span></div>

    <div id="minimap-container">
        <canvas id="minimap" width="108" height="108"></canvas>
    </div>

    <div id="kill-feed"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x6bb3d9);
        scene.fog = new THREE.Fog(0x6bb3d9, 25, 70);

        const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.05, 200);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Освещение
        const sun = new THREE.DirectionalLight(0xfff5e0, 1.15);
        sun.position.set(18, 35, 12);
        sun.castShadow = true;
        scene.add(sun);
        scene.add(new THREE.AmbientLight(0x8899aa, 0.55));
        scene.add(new THREE.HemisphereLight(0xb8d4ff, 0x445533, 0.4));

        const yawObject = new THREE.Object3D();
        const pitchObject = new THREE.Object3D();
        pitchObject.add(camera);
        yawObject.add(pitchObject);
        yawObject.position.set(0, 1.6, 9);
        scene.add(yawObject);

        // ===== VIEWMODEL (Deagle + руки) =====
        const weaponGroup = new THREE.Group();
        camera.add(weaponGroup);

        const skinMat = new THREE.MeshStandardMaterial({ color: 0xf0c090, roughness: 0.75 });
        const metalDark = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.35, metalness: 0.7 });
        const metalSlide = new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.3, metalness: 0.75 });
        const gripMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.7 });

        // Руки
        const rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.11, 0.38), skinMat);
        rightArm.position.set(0.21, -0.21, -0.28);
        rightArm.rotation.set(-0.18, -0.12, 0.05);
        weaponGroup.add(rightArm);

        const leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.095, 0.095, 0.32), skinMat);
        leftArm.position.set(0.07, -0.25, -0.35);
        leftArm.rotation.set(-0.08, 0.28, 0.12);
        weaponGroup.add(leftArm);

        // Deagle
        const grip = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.17, 0.085), gripMat);
        grip.position.set(0.19, -0.13, -0.38);
        grip.rotation.x = 0.28;
        weaponGroup.add(grip);

        const frame = new THREE.Mesh(new THREE.BoxGeometry(0.065, 0.075, 0.24), metalDark);
        frame.position.set(0.19, -0.065, -0.45);
        weaponGroup.add(frame);

        const slide = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.09, 0.34), metalSlide);
        slide.position.set(0.19, 0.01, -0.47);
        weaponGroup.add(slide);

        const barrel = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.035, 0.12), metalDark);
        barrel.position.set(0.19, -0.02, -0.68);
        weaponGroup.add(barrel);

        const frontSight = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.035, 0.025), metalDark);
        frontSight.position.set(0.19, 0.055, -0.62);
        weaponGroup.add(frontSight);

        const rearSight = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.025, 0.02), metalDark);
        rearSight.position.set(0.19, 0.055, -0.32);
        weaponGroup.add(rearSight);

        weaponGroup.position.set(0.05, -0.03, 0.02);

        // ===== КАРТА =====
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(90, 90),
            new THREE.MeshStandardMaterial({ color: 0x3d6b2e, roughness: 0.9 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const grid = new THREE.GridHelper(90, 45, 0x2a4a1a, 0x2a4a1a);
        grid.position.y = 0.02;
        scene.add(grid);

        const wallMat = new THREE.MeshStandardMaterial({ color: 0x8a5a30, roughness: 0.85 });
        const wall1 = new THREE.Mesh(new THREE.BoxGeometry(9, 3.8, 1.1), wallMat);
        wall1.position.set(-3, 1.9, -1);
        wall1.castShadow = true; wall1.receiveShadow = true;
        scene.add(wall1);

        const wall2 = new THREE.Mesh(new THREE.BoxGeometry(1.1, 3.8, 9), wallMat);
        wall2.position.set(5, 1.9, -3);
        wall2.castShadow = true; wall2.receiveShadow = true;
        scene.add(wall2);

        const crateMat = new THREE.MeshStandardMaterial({ color: 0x6b4423, roughness: 0.8 });
        [[-6,1.2,-8],[3,1.2,-12],[-1,1.2,4],[8,1.2,-6]].forEach(p => {
            const c = new THREE.Mesh(new THREE.BoxGeometry(2.4, 2.4, 2.4), crateMat);
            c.position.set(...p);
            c.castShadow = true; c.receiveShadow = true;
            scene.add(c);
        });

        const worldObstacles = [wall1, wall2];

        // ===== БОТЫ =====
        function createCharacter(team, name, x, z) {
            const group = new THREE.Group();
            group.position.set(x, 0, z);

            const coat = team === 'T' ? 0xc62828 : 0x1565c0;
            const matJacket = new THREE.MeshStandardMaterial({ color: coat, roughness: 0.55 });
            const matPants = new THREE.MeshStandardMaterial({ color: 0x1a1a1a });
            const matHead = new THREE.MeshStandardMaterial({ color: 0xf0c090, roughness: 0.7 });
            const matDark = new THREE.MeshBasicMaterial({ color: 0x111111 });

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.36, 0.36), matHead);
            head.position.set(0, 1.58, 0);
            head.userData = { bodyPart: 'head', enemy: group };
            group.add(head);

            // глаза + рот
            [[-0.08,1.62,-0.18],[0.08,1.62,-0.18]].forEach(([x,y,z]) => {
                const e = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.02), matDark);
                e.position.set(x,y,z); group.add(e);
            });
            const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.035, 0.02), matDark);
            mouth.position.set(0, 1.48, -0.18); group.add(mouth);

            const body = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.62, 0.27), matJacket);
            body.position.set(0, 1.08, 0);
            body.userData = { bodyPart: 'body', enemy: group };
            group.add(body);

            [-0.34, 0.34].forEach(ax => {
                const arm = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.55, 0.16), matJacket);
                arm.position.set(ax, 1.06, 0);
                arm.userData = { bodyPart: 'arm', enemy: group };
                group.add(arm);
            });

            [-0.13, 0.13].forEach(lx => {
                const leg = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.58, 0.18), matPants);
                leg.position.set(lx, 0.42, 0);
                leg.userData = { bodyPart: 'leg', enemy: group };
                group.add(leg);
                const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.12, 0.24), new THREE.MeshStandardMaterial({ color: 0x0a0a0a }));
                shoe.position.set(lx, 0.07, 0.02);
                group.add(shoe);
            });

            group.userData = {
                hp: 100, name, team,
                spawnPos: new THREE.Vector3(x, 0, z),
                isDead: false, lastSeenPos: null, lastSeenTime: 0, isVisible: false
            };
            scene.add(group);
            return group;
        }

        const enemies = [
            createCharacter('T', 'Terrorist #1', -4, -7),
            createCharacter('T', 'Terrorist #2', 3, -11),
            createCharacter('CT', 'CT #1', 7, -5)
        ];

        // ===== УПРАВЛЕНИЕ =====
        let moveTouchId = null, lookTouchId = null, fireTouchId = null;
        let touchStartPos = { x: 0, y: 0 };
        let joystickVector = { x: 0, y: 0 };
        let lookLastPos = { x: 0, y: 0 };

        const moveArea = document.getElementById('touch-move-area');
        const lookArea = document.getElementById('touch-look-area');
        const jsBase = document.getElementById('joystick-base');
        const jsKnob = document.getElementById('joystick-knob');
        const btnFire = document.getElementById('btn-fire');

        moveArea.addEventListener('touchstart', e => {
            for (const t of e.changedTouches) {
                if (moveTouchId === null) {
                    moveTouchId = t.identifier;
                    touchStartPos = { x: t.clientX, y: t.clientY };
                    jsBase.style.left = t.clientX + 'px';
                    jsBase.style.top = t.clientY + 'px';
                    jsBase.style.display = 'block';
                    jsKnob.style.transform = 'translate(-50%, -50%)';
                    joystickVector = { x: 0, y: 0 };
                }
            }
        });

        moveArea.addEventListener('touchmove', e => {
            for (const t of e.changedTouches) {
                if (t.identifier === moveTouchId) {
                    const dx = t.clientX - touchStartPos.x;
                    const dy = t.clientY - touchStartPos.y;
                    const dist = Math.hypot(dx, dy);
                    const maxR = 42;
                    const angle = Math.atan2(dy, dx);
                    const clamped = Math.min(dist, maxR);
                    const kx = Math.cos(angle) * clamped;
                    const ky = Math.sin(angle) * clamped;
                    jsKnob.style.transform = `translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`;
                    joystickVector.x = kx / maxR;
                    joystickVector.y = ky / maxR;
                }
            }
        });

        const resetJoy = e => {
            for (const t of e.changedTouches) {
                if (t.identifier === moveTouchId) {
                    moveTouchId = null;
                    jsBase.style.display = 'none';
                    joystickVector = { x: 0, y: 0 };
                }
            }
        };
        moveArea.addEventListener('touchend', resetJoy);
        moveArea.addEventListener('touchcancel', resetJoy);

        function handleLook(dx, dy) {
            yawObject.rotation.y -= dx * 0.0038;
            pitchObject.rotation.x -= dy * 0.0038;
            pitchObject.rotation.x = Math.max(-1.3, Math.min(1.3, pitchObject.rotation.x));
        }

        lookArea.addEventListener('touchstart', e => {
            for (const t of e.changedTouches) {
                if (lookTouchId === null) {
                    lookTouchId = t.identifier;
                    lookLastPos = { x: t.clientX, y: t.clientY };
                }
            }
        });
        lookArea.addEventListener('touchmove', e => {
            for (const t of e.changedTouches) {
                if (t.identifier === lookTouchId) {
                    handleLook(t.clientX - lookLastPos.x, t.clientY - lookLastPos.y);
                    lookLastPos = { x: t.clientX, y: t.clientY };
                }
            }
        });
        const resetLook = e => {
            for (const t of e.changedTouches) if (t.identifier === lookTouchId) lookTouchId = null;
        };
        lookArea.addEventListener('touchend', resetLook);
        lookArea.addEventListener('touchcancel', resetLook);

        // Стрельба
        let isHoldingFire = false, lastFireTime = 0;
        const fireRate = 230;
        let currentAmmo = 7, reserveAmmo = 21, isReloading = false;
        let spreadAcc = 0;
        const raycaster = new THREE.Raycaster();

        function updateAmmoUI() {
            document.getElementById('ammo').innerText = `${currentAmmo} / ${reserveAmmo}`;
        }

        document.getElementById('btn-reload').addEventListener('touchstart', e => {
            e.preventDefault();
            if (isReloading || currentAmmo === 7 || reserveAmmo <= 0) return;
            isReloading = true;
            document.getElementById('ammo').innerText = 'ПЕРЕЗАРЯДКА...';
            setTimeout(() => {
                const need = 7 - currentAmmo;
                const add = Math.min(need, reserveAmmo);
                currentAmmo += add; reserveAmmo -= add;
                isReloading = false; updateAmmoUI();
            }, 1500);
        });

        function addKillFeed(killer, victim) {
            const feed = document.getElementById('kill-feed');
            const entry = document.createElement('div');
            entry.className = 'kill-entry';
            const kClass = killer === 'Игрок' ? 'name-white' : 'name-other';
            const vClass = victim === 'Игрок' ? 'name-white' : 'name-other';
            entry.innerHTML = `<span class="${kClass}">${killer}</span> <span style="color:#ff4444">☠</span> <span class="${vClass}">${victim}</span>`;
            feed.appendChild(entry);
            if (feed.children.length > 5) feed.removeChild(feed.children[0]);
            setTimeout(() => entry.remove(), 4200);
        }

        function shootPistol() {
            if (isReloading || currentAmmo <= 0) return;
            currentAmmo--; updateAmmoUI();

            pitchObject.rotation.x += 0.04;
            weaponGroup.position.z = 0.12;
            spreadAcc = Math.min(spreadAcc + 0.022, 0.07);

            const sx = (Math.random() - 0.5) * spreadAcc;
            const sy = (Math.random() - 0.5) * spreadAcc;
            raycaster.setFromCamera(new THREE.Vector2(sx, sy), camera);

            const hitboxes = [];
            enemies.forEach(e => { if (!e.userData.isDead) hitboxes.push(...e.children); });
            const hits = raycaster.intersectObjects(hitboxes);

            if (hits.length) {
                const mesh = hits[0].object;
                const part = mesh.userData.bodyPart;
                const enemy = mesh.userData.enemy;
                const dmg = part === 'head' ? 100 : 52;
                enemy.userData.hp -= dmg;

                if (enemy.userData.hp <= 0 && !enemy.userData.isDead) {
                    enemy.userData.isDead = true;
                    enemy.rotation.x = -Math.PI / 2;
                    enemy.position.y = 0.15;
                    addKillFeed('Игрок', enemy.userData.name);
                    setTimeout(() => {
                        enemy.userData.isDead = false;
                        enemy.userData.hp = 100;
                        enemy.rotation.x = 0;
                        enemy.position.copy(enemy.userData.spawnPos);
                    }, 3200);
                }
            }
        }

        btnFire.addEventListener('touchstart', e => {
            e.preventDefault();
            isHoldingFire = true;
            for (const t of e.changedTouches) {
                fireTouchId = t.identifier;
                lookLastPos = { x: t.clientX, y: t.clientY };
            }
        });
        btnFire.addEventListener('touchmove', e => {
            for (const t of e.changedTouches) {
                if (t.identifier === fireTouchId) {
                    handleLook(t.clientX - lookLastPos.x, t.clientY - lookLastPos.y);
                    lookLastPos = { x: t.clientX, y: t.clientY };
                }
            }
        });
        const stopFire = e => {
            for (const t of e.changedTouches) {
                if (t.identifier === fireTouchId) { isHoldingFire = false; fireTouchId = null; }
            }
        };
        btnFire.addEventListener('touchend', stopFire);
        btnFire.addEventListener('touchcancel', stopFire);

        // Радар
        const canvas = document.getElementById('minimap');
        const ctx = canvas.getContext('2d');

        function updateMinimap(now) {
            ctx.clearRect(0, 0, 108, 108);
            const cx = 54, cy = 54, scale = 3.3;
            const rot = yawObject.rotation.y;

            // конус обзора
            ctx.strokeStyle = 'rgba(255,255,255,0.45)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx - 16, cy - 26);
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + 16, cy - 26);
            ctx.stroke();

            // игрок
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(cx, cy, 3.5, 0, Math.PI * 2); ctx.fill();

            const eye = yawObject.position.clone(); eye.y += 0.7;

            enemies.forEach(enemy => {
                if (enemy.userData.isDead) return;
                const headPos = enemy.position.clone(); headPos.y += 1.55;
                const dir = headPos.clone().sub(eye).normalize();
                const dist = eye.distanceTo(headPos);
                const los = new THREE.Raycaster(eye, dir, 0, dist - 0.3);
                const blocked = los.intersectObjects(worldObstacles).length > 0;
                enemy.userData.isVisible = !blocked;
                if (!blocked) {
                    enemy.userData.lastSeenPos = enemy.position.clone();
                    enemy.userData.lastSeenTime = now;
                }

                const rx = enemy.position.x - yawObject.position.x;
                const rz = enemy.position.z - yawObject.position.z;
                const mx = cx + (rx * Math.cos(-rot) - rz * Math.sin(-rot)) * scale;
                const my = cy + (rx * Math.sin(-rot) + rz * Math.cos(-rot)) * scale;

                if (enemy.userData.isVisible) {
                    ctx.fillStyle = '#ff2a2a';
                    ctx.beginPath(); ctx.arc(mx, my, 3.8, 0, Math.PI * 2); ctx.fill();
                }
            });
        }

        // Движение
        let velocityY = 0, isGrounded = true, isCrouching = false;
        const targetHeight = { current: 1.6 };
        const playerRadius = 0.38;

        document.getElementById('btn-crouch').addEventListener('touchstart', e => {
            e.preventDefault();
            isCrouching = !isCrouching;
            document.getElementById('btn-crouch').classList.toggle('active', isCrouching);
        });
        document.getElementById('btn-jump').addEventListener('touchstart', e => {
            e.preventDefault();
            if (isGrounded) { velocityY = 5.4; isGrounded = false; }
        });

        function canMoveTo(pos) {
            for (const obj of worldObstacles) {
                const box = new THREE.Box3().setFromObject(obj);
                box.min.x -= playerRadius; box.max.x += playerRadius;
                box.min.z -= playerRadius; box.max.z += playerRadius;
                if (pos.x >= box.min.x && pos.x <= box.max.x && pos.z >= box.min.z && pos.z <= box.max.z) return false;
            }
            for (const e of enemies) {
                if (e.userData.isDead) continue;
                if (Math.hypot(pos.x - e.position.x, pos.z - e.position.z) < playerRadius + 0.42) return false;
            }
            return true;
        }

        let lastTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = Math.min((time - lastTime) / 1000, 0.09);
            lastTime = time;

            if (isHoldingFire && time - lastFireTime > fireRate) {
                shootPistol();
                lastFireTime = time;
            }

            weaponGroup.position.z += (0 - weaponGroup.position.z) * 0.18;
            spreadAcc = Math.max(0, spreadAcc - delta * 0.12);

            const desiredY = isCrouching ? 0.92 : 1.6;
            targetHeight.current += (desiredY - targetHeight.current) * 11 * delta;

            const speed = isCrouching ? 3.3 : 6.8;
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(yawObject.quaternion);
            const side = new THREE.Vector3(1, 0, 0).applyQuaternion(yawObject.quaternion);
            forward.y = 0; forward.normalize();
            side.y = 0; side.normalize();

            const mx = (forward.x * -joystickVector.y + side.x * joystickVector.x) * speed * delta;
            const mz = (forward.z * -joystickVector.y + side.z * joystickVector.x) * speed * delta;

            const nextX = yawObject.position.clone(); nextX.x += mx;
            if (canMoveTo(nextX)) yawObject.position.x = nextX.x;
            const nextZ = yawObject.position.clone(); nextZ.z += mz;
            if (canMoveTo(nextZ)) yawObject.position.z = nextZ.z;

            velocityY -= 19.5 * delta;
            yawObject.position.y += velocityY * delta;
            if (yawObject.position.y <= targetHeight.current) {
                yawObject.position.y = targetHeight.current;
                velocityY = 0;
                isGrounded = true;
            }

            updateMinimap(time);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
