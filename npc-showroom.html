<script type="module">

scene.add(new THREE.HemisphereLight(0xf1f4ff,0x778391,3.3));
const sun=new THREE.DirectionalLight(0xffe2bb,3);sun.position.set(-3,7,5);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-8;sun.shadow.camera.right=8;sun.shadow.camera.top=8;sun.shadow.camera.bottom=-8;scene.add(sun);
const rim=new THREE.DirectionalLight(0xbad9ee,2.5);rim.position.set(3,4,-5);scene.add(rim);

const loader=new GLTFLoader();const asset=p=>import.meta.env.BASE_URL+p;

});
function normalize(model,height=1.8){model.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(model),s=b.getSize(new THREE.Vector3());if(s.y<.01)throw Error('Пустая модель');model.scale.multiplyScalar(height/s.y);model.updateMatrixWorld(true);const bb=new THREE.Box3().setFromObject(model);model.position.y-=bb.min.y;const center=bb.getCenter(new THREE.Vector3());model.position.x-=center.x;model.position.z-=center.z;model.updateMatrixWorld(true)}

function findLimb(root,side,part){
 const all=[];root.traverse(o=>{if(o.isBone)all.push(o)});
 const sideName=side==='r'?'right':'left';
 function matches(name){
   const k=name.toLowerCase().replace(/[^a-z0-9]/g,'');
   const hasSide=k.includes(sideName)||new RegExp('(?:bip[0-9]*|mixamorig)'+side+'(?=upperarm|forearm|lowerarm|arm|hand|wrist)').test(k)||new RegExp('^'+side+'(?=upperarm|forearm|lowerarm|arm|hand|wrist)').test(k);
   if(!hasSide)return false;
   if(part==='hand')return /(?:hand|wrist)/.test(k)&&!/(?:finger|thumb|index|middle|ring|pinky)/.test(k);
   if(part==='forearm')return /(?:forearm|lowerarm)/.test(k);
   return /(?:upperarm|(?<!fore)arm)/.test(k)&&!/(?:forearm|lowerarm|hand|finger)/.test(k);
 }
 return all.find(b=>matches(b.name))||null;
}
function avatarBones(root){return {
 right:{upper:findLimb(root,'r','upper'),lower:findLimb(root,'r','forearm'),hand:findLimb(root,'r','hand')},
 left:{upper:findLimb(root,'l','upper'),lower:findLimb(root,'l','forearm'),hand:findLimb(root,'l','hand')}
}}
const tmpOrigin=new THREE.Vector3(),tmpEnd=new THREE.Vector3(),tmpFrom=new THREE.Vector3(),tmpTo=new THREE.Vector3();
const tmpParentQ=new THREE.Quaternion(),tmpWorldDelta=new THREE.Quaternion(),tmpLocalDelta=new THREE.Quaternion();
function aimJoint(joint,hand,target,strength=.65){
 if(!joint||!hand)return;
 joint.updateWorldMatrix(true,false);hand.updateWorldMatrix(true,false);
 joint.getWorldPosition(tmpOrigin);hand.getWorldPosition(tmpEnd);
 tmpFrom.subVectors(tmpEnd,tmpOrigin);tmpTo.subVectors(target,tmpOrigin);
 if(tmpFrom.lengthSq()<1e-8||tmpTo.lengthSq()<1e-8)return;
 tmpFrom.normalize();tmpTo.normalize();
 tmpWorldDelta.setFromUnitVectors(tmpFrom,tmpTo);
 tmpWorldDelta.slerp(new THREE.Quaternion(),1-strength);
 joint.parent.getWorldQuaternion(tmpParentQ);
 tmpLocalDelta.copy(tmpParentQ).invert().multiply(tmpWorldDelta).multiply(tmpParentQ);
 joint.quaternion.premultiply(tmpLocalDelta).normalize();
 joint.updateMatrixWorld(true);
}
function palmAnchor(limb){
 if(!limb.hand)return null;
 const hand=limb.hand;
 hand.updateWorldMatrix(true,true);
 const knuckles=[];
 hand.traverse(o=>{
   if(o.isBone&&/finger[123]$/i.test(o.name.replace(/[^a-z0-9]/gi,''))){
     const p=new THREE.Vector3();o.getWorldPosition(p);
     knuckles.push(hand.worldToLocal(p));
   }
 });
 const anchor=new THREE.Object3D();
 anchor.name='Palm grip contact';
 if(knuckles.length){
   for(const p of knuckles)anchor.position.add(p);
   anchor.position.divideScalar(knuckles.length).multiplyScalar(.63);
 }else{
   anchor.position.set(0,.045,0);
 }
 hand.add(anchor);
 return anchor;
}
function aimPalmDown(limb,anchor,amount=.48){
 if(!limb.hand||!anchor)return;
 const hand=limb.hand;
 hand.updateWorldMatrix(true,true);
 const wrist=new THREE.Vector3(),palm=new THREE.Vector3();
 hand.getWorldPosition(wrist);anchor.getWorldPosition(palm);
 const present=palm.sub(wrist);
 if(present.lengthSq()<.00001)return;
 // Fingers curl DOWN around the pistol grip / rifle handguard.
 const desired=new THREE.Vector3(0,-1,.18).normalize();
 const correction=new THREE.Quaternion().setFromUnitVectors(present.normalize(),desired);
 correction.slerp(new THREE.Quaternion(),1-amount);
 const parentQ=new THREE.Quaternion();hand.parent.getWorldQuaternion(parentQ);
 const localQ=parentQ.clone().invert().multiply(correction).multiply(parentQ);
 hand.quaternion.premultiply(localQ).normalize();
 hand.updateMatrixWorld(true);
}
function curlFingers(limb){
 if(!limb.hand)return;
 limb.hand.traverse(b=>{
   if(!b.isBone)return;
   const match=b.name.replace(/[^a-z0-9]/gi,'').match(/finger([0-4])([12])?$/i);
   if(!match)return;
   const digit=Number(match[1]),joint=match[2]?Number(match[2]):0;
   if(digit===0){b.rotation.x+=joint===0?.18:.18;return}
   b.rotation.x+=joint===0?.32:joint===1?.50:.33;
 });
 limb.hand.updateMatrixWorld(true);
}

function solveTwoBoneArm(limb,effector,target,side){
 if(!limb.upper||!limb.lower||!limb.hand||!effector)return false;
 limb.upper.updateWorldMatrix(true,false);
 limb.lower.updateWorldMatrix(true,false);
 effector.updateWorldMatrix(true,false);
 const shoulder=new THREE.Vector3(),elbow=new THREE.Vector3(),palm=new THREE.Vector3();
 limb.upper.getWorldPosition(shoulder);limb.lower.getWorldPosition(elbow);effector.getWorldPosition(palm);
 const upperLength=shoulder.distanceTo(elbow),forearmLength=elbow.distanceTo(palm);
 if(upperLength<.05||forearmLength<.05)return false;
 const outward=new THREE.Vector3().subVectors(target,shoulder);
 const reach=outward.length();
 if(reach<.01)return false;
 const dir=outward.normalize();
 const d=Math.min(reach,upperLength+forearmLength-.002);
 const along=(upperLength*upperLength-forearmLength*forearmLength+d*d)/(2*d);
 const bend=Math.sqrt(Math.max(.00001,upperLength*upperLength-along*along));
 // Keep elbow LOWER and OUTSIDE the torso instead of letting CCD pick an
 // arbitrary plane. This is the same pole-vector idea used in character rigs.
 const pole=new THREE.Vector3(side==='right'?-1:1,-.75,-.25);
 pole.addScaledVector(dir,-pole.dot(dir));
 if(pole.lengthSq()<1e-6)pole.set(side==='right'?-1:1,0,0);

   aimJoint(limb.upper,limb.lower,elbowGoal,1);
   aimJoint(limb.lower,effector,target,1);

}

function legBone(root,side,part){
 const prefix=side==='l'?'left':'right';
 const short=side;
 let found=null;
 root.traverse(o=>{
   if(found||!o.isBone)return;
   const n=o.name.toLowerCase().replace(/[^a-z0-9]/g,'');
   const sided=n.includes(prefix)||new RegExp('(?:bip[0-9]*|mixamorig)'+short+'(?=thigh|calf|foot|upleg|leg)').test(n);
   if(!sided)return;
   const ok=part==='upper'?/(thigh|upleg|upperleg)/.test(n)
     :part==='lower'?/(calf|shin|lowerleg)/.test(n)||(/(?:leftleg|rightleg)/.test(n)&&!/upleg|upperleg/.test(n))
     :/(foot|ankle)/.test(n)&&!/toe/.test(n);
   if(ok)found=o;
 });

}
const stanceV=new THREE.Vector3();
function worldLean(bone,angle){
 if(!bone)return;
 bone.parent.updateWorldMatrix(true,false);
 const parentQ=new THREE.Quaternion();
 bone.parent.getWorldQuaternion(parentQ);
 const twist=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),angle);
 bone.quaternion.premultiply(parentQ.clone().invert().multiply(twist).multiply(parentQ)).normalize();
 bone.updateMatrixWorld(true);
}
function setFootWorldRotation(foot,worldQ){
 foot.parent.updateWorldMatrix(true,false);
 const parentQ=new THREE.Quaternion();
 foot.parent.getWorldQuaternion(parentQ);
 foot.quaternion.copy(parentQ.invert().multiply(worldQ)).normalize();
 foot.updateMatrixWorld(true);
}
function bendLeg(upper,lower,foot,ankleTarget){
 if(!upper||!lower||!foot)return null;
 const hip=new THREE.Vector3(),knee=new THREE.Vector3(),ankle=new THREE.Vector3();
 upper.getWorldPosition(hip);lower.getWorldPosition(knee);foot.getWorldPosition(ankle);
 const a=hip.distanceTo(knee),b=knee.distanceTo(ankle);
 if(a<.12||b<.12||a>.9||b>.9)return null;
 const axis=new THREE.Vector3().subVectors(ankleTarget,hip);
 const c=Math.min(Math.max(axis.length(),.01),a+b-.002);
 axis.normalize();
 // Triangle solution with a knee pole facing slightly forwards (+Z).
 const along=(a*a-b*b+c*c)/(2*c);
 const height=Math.sqrt(Math.max(.0001,a*a-along*along));
 const pole=new THREE.Vector3(0,0,1).addScaledVector(axis,-axis.z).normalize();
 if(pole.lengthSq()<.01)pole.set(1,0,0);
 const kneeTarget=hip.clone().addScaledVector(axis,along).addScaledVector(pole,height);
 const soleQ=new THREE.Quaternion();foot.getWorldQuaternion(soleQ);
 // Pose thigh first, then shin, keeping boots flat.
 aimJoint(upper,lower,kneeTarget,1);
 aimJoint(lower,foot,ankleTarget,1);

}
function applyCombatStance(person,label){
 const left={upper:legBone(person,'l','upper'),lower:legBone(person,'l','lower'),foot:legBone(person,'l','foot')};
 const right={upper:legBone(person,'r','upper'),lower:legBone(person,'r','lower'),foot:legBone(person,'r','foot')};
 person.updateMatrixWorld(true);
 const complete=[left,right].every(l=>l.upper&&l.lower&&l.foot);
 if(!complete){
   console.warn(label+' leg bones unavailable — keeping default stance');
   person.position.y+=.145;
   person.updateMatrixWorld(true);
   return {legs:false};
 }
 // Raise the skinned figure onto the podium before calculating ground contact.
 person.position.y+=.145;
 person.updateMatrixWorld(true);
 const feet=[left,right].map(l=>{const p=new THREE.Vector3();l.foot.getWorldPosition(p);return p});
 // Lower the centre of gravity, keeping both feet at their original ground level.
 person.position.y-=.025;

 // Subtle asymmetric stance: feet wider, one foot slightly ahead.

 feet[1].x+=.025;feet[1].z-=.018;
 const leftError=bendLeg(left.upper,left.lower,left.foot,feet[0]);
 const rightError=bendLeg(right.upper,right.lower,right.foot,feet[1]);
 let spine=null,spine2=null;
 person.traverse(o=>{
   if(!o.isBone)return;
   const n=o.name.toLowerCase().replace(/[^a-z0-9]/g,'');
   if(!spine&&/(?:spine1|spine01)$/.test(n))spine=o;
   if(!spine2&&/(?:spine2|spine02)$/.test(n))spine2=o;
 });

 worldLean(spine2,.025);

}

function fitCharacter(model,height=1.86){
 model.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(model);
 const size=box.getSize(new THREE.Vector3());
 if(!Number.isFinite(size.y)||size.y<.01)throw Error('Некорректный размер модели');
 model.scale.multiplyScalar(height/size.y);

 const finalBox=new THREE.Box3().setFromObject(model);
 const center=finalBox.getCenter(new THREE.Vector3());
 model.position.x-=center.x;model.position.y-=finalBox.min.y;model.position.z-=center.z;
 model.updateMatrixWorld(true);
}


function findPoseBone(root,patterns){
 let found=null;
 root.traverse(o=>{
   if(found||!o.isBone)return;
   const name=o.name.toLowerCase().replace(/[^a-z0-9]/g,'');
   if(patterns.some(p=>p.test(name)))found=o;
 });
 return found;
}
function rotateBoneWorld(bone,axis,angle){
 if(!bone||!bone.parent)return;
 bone.parent.updateWorldMatrix(true,false);
 const parentQ=new THREE.Quaternion();
 bone.parent.getWorldQuaternion(parentQ);
 const turn=new THREE.Quaternion().setFromAxisAngle(axis,angle);
 bone.quaternion.premultiply(parentQ.clone().invert().multiply(turn).multiply(parentQ)).normalize();
 bone.updateMatrixWorld(true);
}
function poseUpperBodyForAim(person){
 const spine1=findPoseBone(person,[/(?:spine1|spine01)$/]);
 const spine2=findPoseBone(person,[/(?:spine2|spine02|chest|upperchest)$/]);
 const neck=findPoseBone(person,[/(?:neck|bip01neck)$/]);
 const head=findPoseBone(person,[/(?:head|bip01head)$/]);
 const rightClav=findPoseBone(person,[/(?:rclavicle|rightclavicle|bip01rclavicle)$/]);

 // Weight onto front foot without folding the character over.

 rotateBoneWorld(leftClav,xAxis,.055);
 rotateBoneWorld(leftClav,zAxis,.035);

}
function shoulderStockTarget(person){
 const arm=findPoseBone(person,[/(?:rupperarm|rightupperarm|bip01rupperarm)$/]);
 const collar=findPoseBone(person,[/(?:rclavicle|rightclavicle|bip01rclavicle)$/]);
 if(!arm&&!collar)throw Error('Невозможно найти правое плечо агента');

 (arm||collar).getWorldPosition(p);

}
function worldOffsetToLocal(parent,worldVector){
 // Convert DIRECTION with matrix, not position, to avoid introducing a
 // bogus x offset for the second NPC located at x = 1.5.

}

function mountAK(holder,weaponSource){
 const gun=new THREE.Group();
 gun.name='AK-47 / shoulder-aimed combat pose';
 holder.add(gun);
 const model=weaponSource.clone(true);
 model.updateMatrixWorld(true);
 const rawBox=new THREE.Box3().setFromObject(model);
 const dims=rawBox.getSize(new THREE.Vector3());
 const axis=dims.x>=dims.y&&dims.x>=dims.z?'x':dims.y>=dims.z?'y':'z';
 const len=Math.max(dims.x,dims.y,dims.z);
 if(!Number.isFinite(len)||len<.005)throw Error('AK-47: неправильный размер');
 model.scale.multiplyScalar(.94/len);model.updateMatrixWorld(true);
 const bb=new THREE.Box3().setFromObject(model);
 const center=bb.getCenter(new THREE.Vector3());
 model.position.sub(center);
 gun.add(model);
 // Rotate the rifle's LONG axis, not the camera-facing short axis.
 // Most AK GLBs have the barrel along +X; in this file +Z faces the viewer.
 if(axis==='x')gun.rotation.y=-Math.PI/2+.035;
 else if(axis==='y')gun.rotation.x=Math.PI/2;

 model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
 // Coordinates refer to the rifle's centered source geometry in metres.
 const grip=(longitudinal,vertical)=>{
   if(axis==='x')return new THREE.Vector3(longitudinal,vertical,0);
   if(axis==='y')return new THREE.Vector3(0,longitudinal,vertical);
   return new THREE.Vector3(0,vertical,longitudinal);
 };
 return {gun,right:grip(-.105,-.07),left:grip(.125,.015),stock:grip(-.435,-.025),sight:grip(.19,-.015),axis};
}
function lightenOliveGear(person){
 person.traverse(o=>{
   if(!o.isMesh)return;
   const materials=Array.isArray(o.material)?o.material:[o.material];
   const edited=materials.map(mat=>{
     if(!mat)return mat;
     const name=(mat.name||'').toLowerCase();
     if(!/(olive_bandit_body|olive.*body)/.test(name))return mat;
     const m=mat.clone();
     // Rocketbox body textures are already olive, but dark vertex colours
     // multiply them almost to black in the mobile screenshot.
     m.vertexColors=false;
     m.color.setHex(0xffffff);
     m.emissive.setHex(0x536348);
     m.emissiveIntensity=.20;
     m.metalness=0;
     m.roughness=.96;
     m.needsUpdate=true;
     return m;
   });
   o.material=Array.isArray(o.material)?edited:edited[0];
 });
}
function gripError(hand,target){
 if(!hand)return null;const w=new THREE.Vector3();

}
function pedestal(x){
 const base=new THREE.Mesh(new THREE.CylinderGeometry(1.05,1.12,.15,48),new THREE.MeshStandardMaterial({color:0x354755,metalness:.55,roughness:.4}));
 base.position.set(x,.065,0);base.receiveShadow=true;scene.add(base);
}

async function agent(url,x,weaponSource,label,timeout){
 const gltf=await load(url,label,timeout);
 const holder=new THREE.Group();holder.position.x=x;scene.add(holder);
 const person=gltf.scene;fitCharacter(person,1.84);holder.add(person);
 const stance=applyCombatStance(person,label);
 poseUpperBodyForAim(person);
 person.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.frustumCulled=false}});
 if(label==='Террорист')lightenOliveGear(person);
 holder.updateMatrixWorld(true);
 const arms=avatarBones(person);
 const palmR=palmAnchor(arms.right),palmL=palmAnchor(arms.left);
 const {gun,right,left,stock,sight,axis}=mountAK(holder,weaponSource);
 gun.updateWorldMatrix(true,true);

 // Locate the rifle from the buttstock, not its visual centre: the back of
 // the AK must touch the right shoulder before hands are posed.
 const stockGoal=shoulderStockTarget(person);
 const stockNow=gun.localToWorld(stock.clone());
 const shoulderShift=new THREE.Vector3().subVectors(stockGoal,stockNow);
 gun.position.add(worldOffsetToLocal(holder,shoulderShift));
 gun.updateWorldMatrix(true,true);

 // The right palm holds the pistol grip; the left palm goes UNDER the handguard.
 const rightGoal=gun.localToWorld(right.clone());
 let gotRight=solveTwoBoneArm(arms.right,palmR||arms.right.hand,rightGoal,'right');
 if(gotRight&&palmR){
   aimPalmDown(arms.right,palmR,.22);
   solveTwoBoneArm(arms.right,palmR,rightGoal,'right');
 }
 const leftGoal=gun.localToWorld(left.clone());
 let gotLeft=solveTwoBoneArm(arms.left,palmL||arms.left.hand,leftGoal,'left');
 if(gotLeft&&palmL){
   aimPalmDown(arms.left,palmL,.15);
   solveTwoBoneArm(arms.left,palmL,leftGoal,'left');
 }
 person.updateMatrixWorld(true);
 const rightError=gripError(palmR||arms.right.hand,gun.localToWorld(right.clone()));
 const leftError=gripError(palmL||arms.left.hand,gun.localToWorld(left.clone()));
 const stockError=+gun.localToWorld(stock.clone()).distanceTo(stockGoal).toFixed(3);

 // Child weapon follows the shooting hand in later animations. attach()
 // preserves its initial world transform, including the stock/shoulder fit.
 if(gotRight)arms.right.hand.attach(gun);
 curlFingers(arms.right);curlFingers(arms.left);
 let boneCount=0;person.traverse(o=>{if(o.isBone)boneCount++});
 const result={boneCount,gotRight,gotLeft,rightError,leftError,stockError,stance,weaponAxis:axis,
  rightBone:arms.right.hand?.name,leftBone:arms.left.hand?.name};
 console.info(label+' shoulder-aimed rifle stance',result);
 return result;
}
async function start(){
  pedestal(-1.5);pedestal(1.5);
  const safe=async(label,task)=>{try{return await task()}catch(e){console.error(label,e);status.textContent=label+': '+e.message;return null}};
  const gunGLTF=await safe('AK-47',()=>load(asset('models/ak47.glb'),'AK-47',40000));
  if(!gunGLTF){window.__npcFail('Не загрузился AK-47. Проверь соединение.');window.__npcDone=true;return}
  const gun=gunGLTF.scene;
  status.textContent='Террорист: загрузка…';
  const t=await safe('Террорист',()=>agent(asset('casting/masked/02.glb'),1.5,gun,'Террорист',35000));
  status.textContent='Спецназ: загрузка…';
  // Chosen CT: rigged Police Male 02; no gas-mask placeholder.
  const ct=await safe('Спецназ',()=>agent(asset('casting/realistic/08.glb'),-1.5,gun,'Спецназ',30000));
  window.__npcDone=true;
  if(!ct&&!t)window.__npcFail('Не удалось загрузить персонажей.');
  else status.textContent='Сцена готова · CT: '+(ct?'✓':'ошибка')+' · T: '+(t?'✓':'ошибка')+' · вращай пальцем';
  if(new URLSearchParams(location.search).has('debug')&&ct&&t)status.textContent='CT кисти: '+ct.rightError+'/'+ct.leftError+' м · приклад '+ct.stockError+' м | T кисти: '+t.rightError+'/'+t.leftError+' м';
  console.info('NPC rig info',{ct,t});
}
start();function frame(){requestAnimationFrame(frame);controls.update();renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
