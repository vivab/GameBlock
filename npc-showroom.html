<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><title>GameBlock — NPC showcase</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#0c1219;color:#edf3fa;font:14px system-ui,Arial}#app{position:fixed;inset:0}canvas{display:block}header{position:absolute;top:0;left:0;right:0;z-index:2;padding:17px 18px;background:linear-gradient(#09121ed9,transparent);pointer-events:none}h1{font-size:20px;margin:0 0 4px;letter-spacing:.1em}small{color:#b4c4d0}#status{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:#07131ddc;border:1px solid #ffffff33;border-radius:12px;padding:10px 16px;text-align:center;min-width:220px;max-width:94vw}#hint{position:absolute;right:12px;top:18px;color:#a9bdc9;font-size:12px}#retry{display:none;background:#d7a44a;color:#0d1720;border:0;border-radius:8px;padding:8px 13px;margin-top:7px}#labels{position:absolute;bottom:80px;left:0;right:0;display:flex;justify-content:space-around;pointer-events:none;font-weight:700;text-shadow:0 2px 8px #000}#labels span{padding:7px 15px;border:1px solid #ffffff30;border-radius:8px;background:#0008}@media(max-width:650px){h1{font-size:17px}#hint{display:none}#labels{font-size:12px}}
</style></head><body><div id="app"></div><header><h1>GAMEBLOCK / AGENTS</h1><small>Первый 3D-тест: два агента с AK-47</small><span id="hint">Проведи пальцем — вращение · щипок — масштаб</span></header><div id="labels"><span>CT / СПЕЦНАЗ</span><span>T / ТЕРРОРИСТ</span></div><div id="status">Загрузка моделей…<div><button id="retry" onclick="location.reload()">Повторить</button></div></div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const app=document.querySelector('#app'),status=document.querySelector('#status');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;app.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x101b26);scene.fog=new THREE.Fog(0x101b26,13,29);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,70);camera.position.set(0,2.2,8.8);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.1,0);controls.enableDamping=true;controls.minDistance=3.2;controls.maxDistance=15;controls.maxPolarAngle=Math.PI*.51;controls.update();
scene.add(new THREE.HemisphereLight(0xbad9ff,0x3d3329,2.1));
const sun=new THREE.DirectionalLight(0xffe2bb,3);sun.position.set(-3,7,5);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-8;sun.shadow.camera.right=8;sun.shadow.camera.top=8;sun.shadow.camera.bottom=-8;scene.add(sun);
const rim=new THREE.DirectionalLight(0x5f9ac5,1.8);rim.position.set(3,4,-5);scene.add(rim);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({color:0x25313b,roughness:.94}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const loader=new GLTFLoader();const asset=p=>import.meta.env.BASE_URL+p;const load=url=>new Promise((resolve,reject)=>loader.load(url,resolve,undefined,reject));
function normalize(model,height=1.8){model.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(model),s=b.getSize(new THREE.Vector3());if(s.y<.01)throw Error('Пустая модель');model.scale.multiplyScalar(height/s.y);model.updateMatrixWorld(true);const bb=new THREE.Box3().setFromObject(model);model.position.y-=bb.min.y;const center=bb.getCenter(new THREE.Vector3());model.position.x-=center.x;model.position.z-=center.z;model.updateMatrixWorld(true)}
function findBone(root,patterns){const bones=[];root.traverse(x=>{if(x.isBone)bones.push(x)});return bones.find(b=>patterns.some(p=>p.test(b.name)))}
function holdPose(root){const rUpper=findBone(root,[/right.*(upperarm|arm)/i,/(upperarm|arm).*right/i,/mixamorigRightArm/i]);const lUpper=findBone(root,[/left.*(upperarm|arm)/i,/(upperarm|arm).*left/i,/mixamorigLeftArm/i]);const rFore=findBone(root,[/right.*forearm/i,/mixamorigRightForeArm/i]);const lFore=findBone(root,[/left.*forearm/i,/mixamorigLeftForeArm/i]);if(rUpper)rUpper.rotation.x-=.6;if(lUpper)lUpper.rotation.x-=.75;if(rFore)rFore.rotation.x-=.5;if(lFore)lFore.rotation.x-=.65;return {rHand:findBone(root,[/right.*hand/i,/hand.*right/i]),lHand:findBone(root,[/left.*hand/i,/hand.*left/i]),boneCount:[...root.getObjectsByProperty('isBone',true)].length}}
function pedestal(x){const base=new THREE.Mesh(new THREE.CylinderGeometry(1.12,1.2,.17,48),new THREE.MeshStandardMaterial({color:0x2e3b45,metalness:.65,roughness:.3}));base.position.set(x,.06,0);base.receiveShadow=true;scene.add(base)}
async function agent(url,x,weaponSource){const gltf=await load(url);const holder=new THREE.Group();holder.position.x=x;scene.add(holder);const person=gltf.scene;normalize(person);holder.add(person);person.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.frustumCulled=false}});const pose=holdPose(person);person.updateMatrixWorld(true);
const gun=weaponSource.clone(true);normalize(gun,.72);gun.rotation.y=Math.PI/2;gun.rotation.x=-.10;gun.position.set(0,1.20,.38);holder.add(gun);gun.traverse(o=>{if(o.isMesh)o.castShadow=true});
if(pose.rHand){const handPos=new THREE.Vector3();pose.rHand.getWorldPosition(handPos);const local=holder.worldToLocal(handPos.clone());if(Number.isFinite(local.x)&&local.y>.3&&local.y<2.3){gun.position.set(local.x-.04,local.y-.08,local.z+.22)}}return pose}
async function start(){try{pedestal(-1.5);pedestal(1.5);const weapon=(await load(asset('models/ak47.glb'))).scene;status.textContent='Загружаю спецназ…';const ct=await agent(asset('models/swat_ct.glb'),-1.5,weapon);status.textContent='Загружаю террориста…';const t=await agent(asset('casting/masked/02.glb'),1.5,weapon);status.textContent='Готово · вращай сцену пальцем';setTimeout(()=>{status.style.opacity='.65'},2200);console.info('NPC rig info',{ct,t});}catch(err){console.error(err);status.textContent='Ошибка загрузки: '+err.message;document.querySelector('#retry').style.display='inline-block'}}
start();function frame(){requestAnimationFrame(frame);controls.update();renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
