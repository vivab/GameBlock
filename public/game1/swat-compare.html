<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameBlock — SWAT Test</title><style>body{margin:0;background:#101924;color:white;font:14px system-ui}header{padding:12px;background:#1c2e43}button,input,select{padding:9px;margin:4px;background:#29465d;color:white;border:1px solid #63839c;border-radius:5px}canvas{width:100%;height:68dvh;display:block}small{color:#bad0dd}#info{padding:9px}</style><header><b>GameBlock · SWAT Animated vs Zeal SWAT</b><div><input type="file" id="file" accept=".glb"><select id="clips"></select><button id="play">Пауза</button><button id="front">Спереди</button><button id="side">Сбоку</button></div><small>Выбери swat_animated.glb или zeal_swat_payday2.glb · вращение пальцем, приближение двумя</small></header><canvas id="canvas"></canvas><div id="info">Ожидаю модель GLB</div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script><script>(()=>{const T=THREE,scene=new T.Scene();scene.background=new T.Color(0x18283b);scene.add(new T.HemisphereLight(0xffffff,0x596777,2));const l=new T.DirectionalLight(0xffffff,2);l.position.set(3,6,4);scene.add(l);const camera=new T.PerspectiveCamera(40,1,.01,100);camera.position.set(2,1.7,3.5);const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});const orbit=new T.OrbitControls(camera,renderer.domElement);orbit.target.set(0,.9,0);orbit.update();const ground=new T.GridHelper(10,20);scene.add(ground);let model,mixer,action,paused=false;const clock=new T.Clock(),info=document.querySelector('#info'),clips=document.querySelector('#clips');function resize(){const w=renderer.domElement.clientWidth,h=renderer.domElement.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();document.querySelector('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;info.textContent='Загрузка '+f.name;try{const data=await f.arrayBuffer();const g=await new T.GLTFLoader().parseAsync(data,'');if(model)scene.remove(model);model=g.scene;scene.add(model);model.position.set(0,0,0);model.rotation.set(0,0,0);model.scale.setScalar(1);model.updateMatrixWorld(true);const bounds=new T.Box3().setFromObject(model),sz=bounds.getSize(new T.Vector3()),center=bounds.getCenter(new T.Vector3());if(!sz.y||!isFinite(sz.y))throw Error('Некорректные границы');const k=1.8/sz.y;model.scale.setScalar(k);model.position.set(-center.x*k,-bounds.min.y*k,-center.z*k);orbit.target.set(0,.95,0);camera.position.set(2,1.8,3.4);orbit.update();mixer=new T.AnimationMixer(model);clips.replaceChildren();for(const [i,c]of g.animations.entries()){const o=document.createElement('option');o.value=i;o.textContent=c.name||'Анимация '+(i+1);clips.append(o)}function select(){mixer.stopAllAction();action=g.animations.length?mixer.clipAction(g.animations[+clips.value||0]):null;action?.play()}clips.onchange=select;select();info.textContent=f.name+' · анимаций: '+g.animations.length+' · костей: '+(()=>{let n=0;model.traverse(x=>{if(x.isBone)n++});return n})()}catch(err){info.textContent='Ошибка: '+err.message}};document.querySelector('#play').onclick=()=>{paused=!paused;document.querySelector('#play').textContent=paused?'Играть':'Пауза'};document.querySelector('#front').onclick=()=>{camera.position.set(0,1.6,3.5);orbit.update()};document.querySelector('#side').onclick=()=>{camera.position.set(3.5,1.6,0);orbit.update()};function tick(){requestAnimationFrame(tick);const dt=clock.getDelta();if(mixer&&!paused)mixer.update(dt);orbit.update();renderer.render(scene,camera)}tick()})();</script></html>
