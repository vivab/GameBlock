name: Smoke Test Live Masked Gallery
on:
  workflow_run:
    workflows: ["Deploy GameBlock"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-gallery:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check the live mobile page and all ten GLB files
        run: |
          set -euo pipefail
          base="https://vivab.github.io/GameBlock"
          ver="checked-${GITHUB_RUN_ID}"
          curl -fLsS --retry 8 --retry-delay 3 "$base/terrorists.html?v=$ver" -o /tmp/gallery.html
          grep -q '10 БОЙЦОВ В МАСКАХ' /tmp/gallery.html
          curl -fLsS --retry 8 --retry-delay 3 "$base/casting/masked/manifest.json?v=$ver" -o /tmp/masked.json
          python3 - <<'PY'
          import json
          manifest=json.load(open('/tmp/masked.json'))
          assert manifest['total']==10
          assert manifest['maskedOnly']
          assert len({m['sourceId'] for m in manifest['models']})==10
          assert all(m['male'] and m['masked'] and m['boneCount']>=70 for m in manifest['models'])
          print('Verified 10 male characters with actual fitted face-coverings.')
          PY
          for n in $(seq -w 1 10); do
            curl -fLsS --retry 5 --retry-delay 2 "$base/casting/masked/$n.glb?v=$ver" -o "/tmp/masked-$n.glb"
            test "$(head -c 4 "/tmp/masked-$n.glb")" = glTF
            echo "Validated 3D T-$n: $(stat -c %s "/tmp/masked-$n.glb") bytes"
          done
          echo "PASS: All ten real GLB assets load from public Pages."
