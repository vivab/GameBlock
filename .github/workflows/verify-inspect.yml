name: Verify interruptible inspect (temporary)
on:
  push:
    branches: [fix/interruptible-knife-inspect]
    paths: ['.github/workflows/verify-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm install --no-save puppeteer-core
      - name: Verify inspect, switch and restart controls in browser
        run: |
          npm run preview -- --host 127.0.0.1 >/tmp/gameblock-preview.log 2>&1 &
          sleep 4
          node --input-type=module <<'JS'
          import puppeteer from 'puppeteer-core';
          import assert from 'node:assert/strict';
          const browser = await puppeteer.launch({ executablePath:'/usr/bin/google-chrome',
            headless:true, args:['--no-sandbox','--disable-dev-shm-usage','--enable-webgl',
              '--ignore-gpu-blocklist','--use-gl=angle','--use-angle=swiftshader'] });
          try {
            const page=await browser.newPage();
            await page.setViewport({width:1200,height:520});
            const errors=[];
            page.on('pageerror',error=>errors.push(error.message));
            await page.goto('http://127.0.0.1:4173/GameBlock/',{waitUntil:'networkidle2',timeout:60000});
            await page.click('#chooseCT');
            await page.keyboard.press('Digit2');
            assert.equal(await page.$eval('#weaponLabel',el=>el.textContent),'Нож');
            await page.keyboard.press('KeyF');
            await new Promise(done=>setTimeout(done,150));
            await page.keyboard.press('KeyF');
            await page.keyboard.press('Digit3');
            assert.equal(await page.$eval('#weaponLabel',el=>el.textContent),'AK-47');
            await page.keyboard.press('Digit2');
            await page.keyboard.press('KeyF');
            await new Promise(done=>setTimeout(done,150));
            assert.deepEqual(errors,[]);
            console.log('BROWSER PASS: inspect twice, switch during inspect, inspect knife again');
          } finally { await browser.close(); }
          JS
