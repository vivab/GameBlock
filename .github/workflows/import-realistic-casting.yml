name: Import ten realistic male operators (Rocketbox MIT)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-realistic-casting.yml'
      - 'scripts/fetch_rocketbox.py'
      - 'scripts/blender_rocketbox.py'
      - 'scripts/validate_rocketbox.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rocketbox-male-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Blender FBX converter and texture tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq blender python3-numpy
          python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
          /usr/bin/python3 -c 'import numpy; print("Blender system NumPy", numpy.__version__)'
      - name: Download ten independent male soldier and police avatars (Microsoft MIT)
        run: python scripts/fetch_rocketbox.py
      - name: Convert FBX skeletal meshes to textured GLB and retain bones
        run: |
          set -euo pipefail
          for n in $(seq -w 1 10); do
            src=$(find "rocketbox_sources/$n" -maxdepth 1 -name '*.fbx' -print -quit)
            test -n "$src"
            blender --background --factory-startup --python scripts/blender_rocketbox.py -- "$src" "public/casting/realistic/$n.glb"
          done
      - name: Validate ten male skinned GLBs and write manifest
        run: python scripts/validate_rocketbox.py
      - name: Commit actual source-character GLBs to GameBlock (never upstream)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/casting/realistic/
          if git diff --cached --quiet; then
            echo 'The ten realistic models are already stored in GameBlock.'
          else
            git commit -m 'Import ten real MIT-licensed male rigged tactical character GLBs'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
