name: Fetch CC0 player models (temporary)
on:
  push:
    branches: [feat/licensed-cs-style-models]
    paths: ['.github/workflows/import-cc0-gameblock.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect sources and fetch SWAT
        run: |
          python3 - <<'PY'
          import requests, pathlib, re, json, struct, hashlib
          dest=pathlib.Path("public/models"); dest.mkdir(parents=True,exist_ok=True)
          sources = {
            "ct_swat": "https://static.poly.pizza/713f6535-f4f3-4367-a4c6-ced126ae0936.glb"
          }
          for name,url in sources.items():
            r=requests.get(url,timeout=90)
            print("FETCH",name, r.status_code, len(r.content), r.url)
            r.raise_for_status()
            assert r.content[:4]==b"glTF", "bad model header"
            target=dest/(name+".glb")
            target.write_bytes(r.content)
            print("SHA256",name,hashlib.sha256(r.content).hexdigest())
            n=struct.unpack_from("<I",r.content,12)[0]
            meta=json.loads(r.content[20:20+n])
            print("MODEL",name,"animations",[(a.get("name",""),len(a.get("channels",[]))) for a in meta.get("animations",[])][:28],"skins",len(meta.get("skins",[])),"nodes",len(meta.get("nodes",[])),"meshes",len(meta.get("meshes",[])))
          for name,url in {"hoodie":"https://poly.pizza/m/gKLBoRsyKe","enemy":"https://poly.pizza/m/mdGe4IN31v"}.items():
            try:
              r=requests.get(url,timeout=40,headers={"User-Agent":"Mozilla/5.0"})
              print("PAGE",name,r.status_code,len(r.content),r.url)
              for label,pat in {"glb":r"https?[^\"'<> ]+?\.glb","polycdn":r"static\.poly\.pizza.{0,200}","download":r"Download.{0,150}","asset":r"asset.{0,100}"}.items():
                items=re.findall(pat,r.text,re.I)
                print("MATCH",name,label,len(items),[x[:250] for x in items[:6]])
              (pathlib.Path("/tmp")/(name+".html")).write_text(r.text)
            except Exception as e: print("PAGE ERROR",name,type(e).__name__,str(e))
          PY
      - name: Commit downloaded model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/ct_swat.glb
          git diff --cached --quiet || (git commit -m "Import CC0 Quaternius SWAT player model" && git push)
