name: Verify CC0 character integration (temporary)
on:
  push:
    branches: [feat/licensed-cs-style-models]
    paths: ['.github/workflows/import-cc0-gameblock.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check GLB skeletons and rifle/idle/run clips
        run: |
          python3 - <<'PY'
          import json,pathlib,struct
          for path in [pathlib.Path("public/models/ct_swat.glb"),pathlib.Path("public/models/t_hoodie.glb")]:
            b=path.read_bytes()
            assert b[:4]==b"glTF"
            meta=json.loads(b[20:20+struct.unpack_from("<I",b,12)[0]])
            clips=[a.get("name","") for a in meta.get("animations",[])]
            assert len(meta.get("skins",[]))>=1
            for name in ["Idle_Gun","Run_Shoot","Gun_Shoot","Death"]:
              assert any(clip.endswith("|"+name) or clip==name for clip in clips), (path,name)
            print(path,"ready:",len(clips),"animations",len(meta.get("skins",[])),"skin(s)")
          PY
