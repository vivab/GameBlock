name: Deploy GameBlock
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate Counter Flame SWAT V8 Urban (detailed face and helmet)
        run: |
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'trimesh>=4,<5' 'scipy>=1.11,<2'
          python scripts/build_counter_flame_swat_v2.py
          python scripts/build_counter_flame_swat_v5.py
          python scripts/build_counter_flame_swat_v7.py
          python scripts/build_counter_flame_swat_v8.py
      - run: npm ci
      - name: Confirm full imported Game1 maps, weapons and mode pages
        run: |
          bash scripts/sync-game1-assets.sh
          test -s public/game1/de_dust2_-_cs_map.glb
          test -s public/game1/lowpoly__fps__tdm__game__map_by_resoforge.glb
          test -s public/game1/hands.js
          test -s public/game1/bomb.html
          test -s public/game1/bomb.js
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
