name: Restore supplied SAS operator
on:
  push:
    branches:
      - assets/source-glb-import

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reassemble and verify original CS2 SAS GLB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/models
          cat .asset-transfer/operator_ct.part*.b64 | base64 --decode > public/models/operator_ct.glb
          echo 'fe0dfa6507ec15946bb4f7314ea10b5bdeb31bb322d82e6c17342b9347962281  public/models/operator_ct.glb' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          from struct import unpack_from
          data = Path('public/models/operator_ct.glb').read_bytes()
          assert data[:4] == b'glTF', 'Invalid GLB signature'
          assert unpack_from('<I', data, 8)[0] == len(data), 'Incorrect GLB byte length'
          print('Valid GLB:', len(data), 'bytes')
          PY
      - name: Commit model and remove temporary transfer data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .asset-transfer
          git rm .github/workflows/assemble-models.yml
          git add public/models/operator_ct.glb
          git commit -m "Restore original SAS model (sha256 verified)"
          git push origin HEAD:assets/source-glb-import
