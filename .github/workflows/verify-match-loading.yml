name: Verify match loading and operators
on:
  push:
    branches: [feature/match-loading-procedural-operators]
    paths: ['.github/workflows/verify-match-loading.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm install --no-save puppeteer-core
      - name: Browser smoke test
        run: |
          npm run preview -- --host 127.0.0.1 >/tmp/preview.log 2>&1 &
          sleep 3
          node --input-type=module <<'JS'
          import puppeteer from 'puppeteer-core';
          import assert from 'node:assert/strict';
          const browser = await puppeteer.launch({
            executablePath: '/usr/bin/google-chrome', headless: true,
            args: ['--no-sandbox', '--disable-dev-shm-usage', '--enable-webgl', '--ignore-gpu-blocklist', '--use-gl=angle', '--use-angle=swiftshader']
          });
          try {
            const page = await browser.newPage();
            await page.setViewport({width: 1180, height: 620});
            const errors = [];
            page.on('pageerror', e => errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/GameBlock/', {waitUntil:'networkidle2', timeout:60000});
            assert.equal(await page.$eval('#matchLoading', e=>e.hidden), true);
            await page.click('#chooseT');
            await page.waitForFunction(()=>document.body.dataset.phase==='playing', {timeout:60000});
            assert.equal(await page.$eval('#matchLoading',e=>e.hidden),true);
            assert.equal(await page.$eval('#matchLoadingPercent',e=>e.textContent),'100%');
            await page.keyboard.press('Digit3');
            await page.keyboard.press('Digit2');
            await page.screenshot({path:'/tmp/gameblock-block-operators.png'});
            assert.deepEqual(errors, []);
            console.log('BROWSER PASS: loading progress 100%, match started, weapons selectable, no JS errors');
          } finally { await browser.close(); }
          JS
