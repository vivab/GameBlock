name: Recolor masked T-02 and T-05 to olive
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recolor-olive-terrorists.yml'
      - 'scripts/recolor_olive_terrorists.py'
      - 'scripts/validate_olive_terrorists.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gameblock-olive-terrorist-recolor
  cancel-in-progress: false
jobs:
  recolor:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image tooling for real glTF clothing textures
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Dye real T-02 and T-05 photographic clothing textures
        run: python scripts/recolor_olive_terrorists.py
      - name: Check actual embedded olive pixels and UNCHANGED skeleton and masks
        run: python scripts/validate_olive_terrorists.py
      - name: Publish both edited GLBs and manifest to GameBlock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/casting/masked/02.glb public/casting/masked/05.glb public/casting/masked/manifest.json
          if git diff --cached --quiet; then
            echo "Already up to date with real olive GLBs."
          else
            git commit -m 'Give masked T-02 and T-05 genuine olive khaki clothing textures'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
