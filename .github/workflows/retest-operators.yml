name: Validate original Leet baked skeleton
on:
  push:
    branches: [feat/cs-classic-operators]
    paths: ['.github/workflows/retest-operators.yml']

permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test # Bone geometry verified in normalized rest pose
      - run: npm run build
      - name: Verify original assets are used without external downloads
        run: |
          test -f public/models/ct.glb
          test -f public/models/t.glb
          test -f public/models/g18.glb
          test -f public/models/knife_t.glb
          test -f public/models/knife_ct.glb
          test -f public/models/ak47.glb
          test ! -f public/models/ct_swat.glb
          test ! -f public/models/t_hoodie.glb
      - name: Install Chromium test helper
        run: npm install --no-save puppeteer-core
      - name: Test actual GLB loading in browser and take visuals
        run: |
          npm run preview -- --host 127.0.0.1 >/tmp/gameblock-preview.log 2>&1 &
          sleep 4
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import puppeteer from 'puppeteer-core';
          const browser=await puppeteer.launch({
            executablePath:'/usr/bin/google-chrome',headless:true,
            args:['--no-sandbox','--disable-dev-shm-usage','--enable-webgl',
              '--ignore-gpu-blocklist','--use-gl=angle','--use-angle=swiftshader']
          });
          const page=await browser.newPage();
          await page.setViewport({width:1240,height:500,deviceScaleFactor:1});
          const errors=[],downloads=[];
          page.on('pageerror',e=>{errors.push(e.message);console.log('PAGE_ERROR',e.message)});
          page.on('console',m=>{
            if(/Cannot rig|Could not load|Не удалось загрузить/.test(m.text()))errors.push(m.text());
          });
          page.on('response',r=>{
            if(/\/models\/(ct|t)\.glb/.test(r.url()))downloads.push([r.url(),r.status()]);
          });
          fs.mkdirSync('qa',{recursive:true});
          for (const [team,button] of [['ct','#chooseCT'],['t','#chooseT']]) {
            await page.goto('http://127.0.0.1:4173/GameBlock/',{waitUntil:'networkidle2',timeout:60000});
            await page.click(button);
            await new Promise(resolve=>setTimeout(resolve,1400));
            await page.screenshot({path:'qa/classic-'+team+'.png'});
            assert.equal(await page.$eval('#teamBadge',el=>el.textContent),team==='ct'?'Спецназ':'Террористы');
          }
          assert.ok(downloads.some(([u,c])=>u.includes('/ct.glb')&&c===200),JSON.stringify(downloads));
          assert.ok(downloads.some(([u,c])=>u.includes('/t.glb')&&c===200),JSON.stringify(downloads));
          assert.deepEqual(errors,[]);
          console.log('BROWSER PASS: original GIGN and Leet GLBs both downloaded and rigged.');
          await browser.close();
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classic-operator-screenshots
          path: qa/classic-*.png
