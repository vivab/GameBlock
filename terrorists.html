#selected{z-index:10;pointer-events:auto;left:auto;right:max(10px,env(safe-area-inset-right));top:74px;bottom:auto;transform:none;max-width:min(320px,51vw);min-width:220px;padding:10px 12px;text-align:left;border:1px solid #d1ba8c}
